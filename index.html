<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gaming Network</title>
    <script>
        window.__novaRedirectFallback = setTimeout(() => {
            window.location.replace('/stats.html');
        }, 2500);
    </script>
    <script type="module">
        (async () => {
            const redirect = target => {
                clearTimeout(window.__novaRedirectFallback);
                window.location.replace(target);
            };

            try {
                const { getSession } = await import('/src/auth.js');
                const session = await getSession();
                if (session) {
                    redirect('/dashboard.html');
                } else {
                    redirect('/stats.html');
                }
            } catch (e) {
                redirect('/stats.html');
            }
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/stats.html">
    </noscript>
</head>
<body style="background:#0A0A0A;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p style="opacity:0.4;">Redirecting...</p>
</body>
</html>
