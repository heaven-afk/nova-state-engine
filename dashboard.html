<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>Dashboard — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="page-body">
        <!-- Metric Cards -->
        <div class="metrics-grid" id="metrics-grid">
            <div class="metric-card stat-card">
                <div class="metric-label">Total Sessions</div>
                <div class="metric-value" id="m-sessions">--</div>
            </div>
            <div class="metric-card stat-card">
                <div class="metric-label">Total Kills</div>
                <div class="metric-value" id="m-kills">--</div>
            </div>
            <div class="metric-card stat-card">
                <div class="metric-label">Active Players</div>
                <div class="metric-value" id="m-players">--</div>
            </div>
            <div class="metric-card stat-card">
                <div class="metric-label">Latest Session</div>
                <div class="metric-value" id="m-latest" style="font-size:1rem;">--</div>
            </div>
        </div>

        <!-- Recent Sessions -->
        <div class="card mb-md stat-card">
            <div class="card-header">
                <span class="card-title">RECENT SESSIONS</span>
                <a href="/weekly.html" class="btn btn-secondary btn-sm">View All</a>
            </div>
            <div class="card-body">
                <div class="table-wrap">
                    <table class="data-table" id="recent-table">
                        <thead>
                            <tr>
                                <th>Session</th>
                                <th>Date</th>
                                <th>Lobbies</th>
                                <th class="hide-mobile">Status</th>
                                <th id="th-actions" class="hidden">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="recent-tbody">
                            <tr><td colspan="5" class="text-muted text-center" style="padding:24px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Quick Kill Leaderboard -->
        <div class="card stat-card">
            <div class="card-header">
                <span class="card-title">TOP FRAGGERS — LATEST SESSION</span>
                <a href="/matches.html" class="btn btn-secondary btn-sm">Full Board</a>
            </div>
            <div class="card-body">
                <div class="table-wrap">
                    <table class="data-table" id="kills-table">
                        <thead>
                            <tr><th>Rank</th><th>Player</th><th>Team</th><th>Kills</th></tr>
                        </thead>
                        <tbody id="kills-tbody">
                            <tr><td colspan="4" class="text-muted text-center" style="padding:24px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { getDashboardStats, getTopFraggers } from '/src/db.js';

        (async () => {
            const profile = await requireRole('mod');
            if (!profile) return;
            injectLayout('dashboard', 'DASHBOARD', profile);

            const isAdminOrOwner = profile.role === 'admin' || profile.role === 'owner';

            async function loadDashboardData() {
                try {
                    const stats = await getDashboardStats();
                    setText('m-sessions', stats.totalSessions);
                    setText('m-kills', stats.totalKills.toLocaleString());
                    setText('m-players', stats.activePlayers);
                    setText('m-latest', stats.latestSession?.session_name || 'No sessions yet');

                    // Recent sessions table
                    const tbody = document.getElementById('recent-tbody');
                    const thActions = document.getElementById('th-actions');
                    
                    if (stats.recentSessions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:24px;">No sessions yet</td></tr>';
                        if (thActions) thActions.classList.add('hidden');
                    } else {
                        if (isAdminOrOwner && thActions) {
                            thActions.classList.remove('hidden');
                        }
                        tbody.innerHTML = stats.recentSessions.map(s => `<tr>
                            <td style="font-weight:600;">${s.session_name}</td>
                            <td class="font-data">${new Date(s.date).toLocaleDateString()}</td>
                            <td class="font-data">${s.lobby_count}</td>
                            <td class="hide-mobile"><span class="badge badge-green">Active</span></td>
                            ${isAdminOrOwner ? `
                            <td>
                                <div style="display:flex; gap:8px;">
                                    <a href="/upload.html?session_id=${s.id}" class="btn btn-secondary btn-sm" style="padding:4px 8px; min-height:auto; display:inline-flex; align-items:center; gap:4px;" title="Edit Session">
                                        <iconify-icon icon="lucide:edit-3"></iconify-icon> Edit
                                    </a>
                                    <button class="btn btn-danger btn-sm btn-delete-row" data-id="${s.id}" data-name="${s.session_name}" style="padding:4px 8px; min-height:auto; display:inline-flex; align-items:center; gap:4px;" title="Delete Session">
                                        <iconify-icon icon="lucide:trash-2"></iconify-icon> Delete
                                    </button>
                                </div>
                            </td>` : ''}
                        </tr>`).join('');

                        if (isAdminOrOwner) {
                            tbody.querySelectorAll('.btn-delete-row').forEach(btn => {
                                btn.addEventListener('click', async (e) => {
                                    const btnTarget = e.currentTarget;
                                    const sessionId = btnTarget.dataset.id;
                                    const sessionName = btnTarget.dataset.name;
                                    
                                    if (confirm(`Are you absolutely sure you want to delete "${sessionName}"?\nThis will permanently delete all associated match results and player statistics.`)) {
                                        btnTarget.disabled = true;
                                        btnTarget.innerHTML = '<span class="spin">⟳</span>';
                                        
                                        try {
                                            const { deleteSession } = await import('/src/db.js');
                                            await deleteSession(sessionId);
                                            showToast('Session deleted successfully', 'success');
                                            await loadDashboardData();
                                        } catch (err) {
                                            console.error('Delete error:', err);
                                            showToast('Failed to delete session: ' + err.message, 'error');
                                            btnTarget.disabled = false;
                                            btnTarget.innerHTML = '<iconify-icon icon="lucide:trash-2"></iconify-icon> Delete';
                                        }
                                    }
                                });
                            });
                        }
                    }

                    // Top fraggers for latest session
                    const ktbody = document.getElementById('kills-tbody');
                    if (stats.latestSession) {
                        const fraggers = await getTopFraggers(stats.latestSession.id, 5);
                        if (fraggers.length === 0) {
                            ktbody.innerHTML = '<tr><td colspan="4" class="text-muted text-center" style="padding:24px;">No player data yet</td></tr>';
                        } else {
                            ktbody.innerHTML = fraggers.map((p, i) => {
                                const rankClass = i < 3 ? ` rank-${i+1}` : '';
                                const logoHTML = p.team_logo 
                                    ? `<img src="${p.team_logo}" alt="Logo" style="width:16px; height:16px; border-radius:2px; object-fit:cover; margin-right:6px; display:inline-block; vertical-align:middle;">`
                                    : `<iconify-icon icon="lucide:shield" style="font-size:0.9rem; color:var(--text-muted); margin-right:6px; vertical-align:middle;"></iconify-icon>`;
                                return `<tr class="${rankClass}">
                                    <td>${i+1}</td>
                                    <td style="font-weight:600;">${escapeHTML(p.player_name)}</td>
                                    <td class="text-muted" style="white-space:nowrap;">
                                        ${logoHTML}
                                        <span style="vertical-align:middle;">${escapeHTML(p.team_name)}</span>
                                    </td>
                                    <td class="text-green font-data" style="font-size:1.1rem;font-weight:700;">${p.kills}</td>
                                </tr>`;
                            }).join('');
                        }
                    } else {
                        ktbody.innerHTML = '<tr><td colspan="4" class="text-muted text-center" style="padding:24px;">No session data yet</td></tr>';
                    }
                } catch (e) {
                    console.error('Dashboard load error:', e);
                }
            }

            await loadDashboardData();

            // Stagger card entrance animations
            document.querySelectorAll('.stat-card').forEach((card, i) => {
                setTimeout(() => card.classList.add('visible'), i * 60);
            });
        })();

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
    </script>
</body>
</html>
