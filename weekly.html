<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Stats — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="page-body">
        <div class="card mb-md">
            <div class="card-header"><span class="card-title">WEEKLY ROLLUP</span></div>
            <div class="card-body">
                <div class="text-muted text-center" style="padding: 40px;">
                    <iconify-icon icon="lucide:calendar-clock" style="font-size:3rem; opacity:0.5; margin-bottom:16px;"></iconify-icon>
                    <p>Weekly aggregation views will be enabled once multiple sessions are logged.</p>
                    <a href="/dashboard.html" class="btn btn-secondary mt-md">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout } from '/src/layout.js';

        const profile = await requireRole('mod');
        if (!profile) throw new Error('Unauthorized');
        injectLayout('weekly', 'WEEKLY STATS', profile);
    </script>
</body>
</html>
