<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Leaderboards — Nova Stat Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g fill="var(--accent-primary)">
                            <path d="M68 5C61 5 57 11 60 17L83 45C86 49 92 49 95 45L97 42C101 37 101 29 96 24L79 7C76 4 72 5 68 5Z" />
                            <path d="M12 2C5 2 1 8 4 14L86 96C89 99 95 99 98 96L99 95C102 91 102 83 97 78L23 4C20 1 16 2 12 2Z" />
                            <path d="M3 58C-1 63 -1 71 4 76L21 93C24 96 28 95 32 95C39 95 43 89 40 83L17 55C14 51 8 51 5 55L3 58Z" />
                        </g>
                    </svg>
                </div>
                <span class="brand-text">NOVA GAMING</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">MAIN</div>
                <a href="/" class="nav-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard" class="nav-icon"></iconify-icon><span>Dashboard</span></a>
                <a href="/weeks.html" class="nav-item" data-page="weeks"><iconify-icon icon="lucide:calendar-days" class="nav-icon"></iconify-icon><span>Weeks</span></a>
                <div class="nav-section">ANALYSIS</div>
                <a href="/ocr-review.html" class="nav-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye" class="nav-icon"></iconify-icon><span>OCR Review</span></a>
                <a href="/leaderboards.html" class="nav-item active" data-page="leaderboards"><iconify-icon icon="lucide:trophy" class="nav-icon"></iconify-icon><span>Leaderboards</span></a>
                <a href="/exports.html" class="nav-item" data-page="exports"><iconify-icon icon="lucide:download-cloud" class="nav-icon"></iconify-icon><span>Exports</span></a>
                <div class="nav-section">SYSTEM</div>
                <a href="/settings.html" class="nav-item" data-page="settings"><iconify-icon icon="lucide:settings" class="nav-icon"></iconify-icon><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><button data-action="signout" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;gap:6px;"><iconify-icon icon="lucide:log-out"></iconify-icon> Sign Out</button></div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu-btn" id="mobile-menu-toggle"><iconify-icon icon="lucide:menu"></iconify-icon></button>
                    <h1 class="page-title">Leaderboards</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-profile"><div class="avatar">U</div><div class="user-info"><span class="user-name">User</span><span class="user-role">Member</span></div></div>
                </div>
            </header>

            <main class="page-content">
                <!-- Week Selector -->
                <div class="form-group">
                    <label class="form-label">Select Week</label>
                    <select class="form-select" id="week-select">
                        <option value="">Loading weeks...</option>
                    </select>
                </div>

                <!-- Leaderboard -->
                <div class="card mt-md" id="lb-card" style="display:none;">
                    <div class="card-header">
                        <h2 class="card-title" id="lb-title">Weekly Rankings</h2>
                    </div>
                    <div class="card-body">
                        <!-- Mobile cards -->
                        <div class="data-list desktop-table" id="lb-list"></div>
                    </div>
                    <!-- Desktop table -->
                    <div class="table-container">
                        <table class="data-table" id="lb-table">
                            <thead><tr><th>Rank</th><th>Player</th><th>Days</th><th>Avg/Day</th><th>Avg/Lobby</th><th>Best Day</th><th>Total</th></tr></thead>
                            <tbody id="lb-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="empty-state" id="lb-empty" style="display:none;">
                    <iconify-icon icon="lucide:trophy"></iconify-icon>
                    <h2>No Stats Yet</h2>
                    <p>Approve lobby data to populate leaderboards.</p>
                </div>
            </main>
        </div>
    </div>

    <nav class="bottom-tabs">
        <a href="/" class="tab-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard"></iconify-icon><span>Home</span></a>
        <a href="/weeks.html" class="tab-item" data-page="weeks"><iconify-icon icon="lucide:calendar-days"></iconify-icon><span>Weeks</span></a>
        <a href="/ocr-review.html" class="tab-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye"></iconify-icon><span>OCR</span></a>
        <a href="/leaderboards.html" class="tab-item active" data-page="leaderboards"><iconify-icon icon="lucide:trophy"></iconify-icon><span>Ranks</span></a>
        <a href="/settings.html" class="tab-item" data-page="settings"><iconify-icon icon="lucide:settings"></iconify-icon><span>More</span></a>
    </nav>

    <script type="module">
        import { initApp, showToast } from '/src/router.js';
        import { getAllWeeks } from '/src/db.js';
        import { getWeeklyLeaderboard } from '/src/stats-engine.js';

        await initApp('leaderboards');

        const select = document.getElementById('week-select');
        const card = document.getElementById('lb-card');
        const empty = document.getElementById('lb-empty');

        // Load weeks
        const weeks = await getAllWeeks();
        select.innerHTML = '<option value="">— Select a week —</option>' +
            weeks.map(w => `<option value="${w.id}">${w.name}</option>`).join('');

        select.addEventListener('change', async () => {
            const weekId = select.value;
            if (!weekId) { card.style.display = 'none'; return; }

            try {
                const data = await getWeeklyLeaderboard(weekId);
                if (data.length === 0) {
                    card.style.display = 'none';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';
                card.style.display = 'block';

                // Mobile list
                document.getElementById('lb-list').innerHTML = data.map((p, i) => {
                    const rc = i < 3 ? ` rank-${i + 1}` : '';
                    return `<div class="data-item">
                        <div class="data-item-rank${rc}">${i + 1}</div>
                        <div class="data-item-content">
                            <div class="data-item-title">${p.name}</div>
                            <div class="data-item-subtitle">${p.daysPlayed}d · ${p.avgKillsPerDay}/day · Best: ${p.bestDayKills}</div>
                        </div>
                        <div class="data-item-value">${p.weeklyTotal}</div>
                    </div>`;
                }).join('');

                // Desktop table
                document.getElementById('lb-tbody').innerHTML = data.map((p, i) => `<tr>
                    <td><div class="data-item-rank${i < 3 ? ` rank-${i + 1}` : ''}">${i + 1}</div></td>
                    <td style="font-weight:600;">${p.name}</td>
                    <td>${p.daysPlayed}</td>
                    <td>${p.avgKillsPerDay}</td>
                    <td>${p.avgKillsPerLobby}</td>
                    <td>${p.bestDayKills}</td>
                    <td class="font-mono font-bold text-cyan">${p.weeklyTotal}</td>
                </tr>`).join('');
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        });
    </script>
</body>
</html>
