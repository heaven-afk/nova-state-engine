<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gaming Network — Staff Portal</title>
    <meta name="description" content="Staff login for Nova Gaming Network Scrims Stats Platform">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Barlow', sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            background: #0F0F0F;
            border: 0.5px solid rgba(108,182,4,0.20);
            border-top: 2px solid #6CB604;
            border-radius: 4px;
            padding: 40px 32px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
        }

        .login-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            color: #6CB604;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .login-logo p {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #0A0A0A;
            border: 0.5px solid rgba(108,182,4,0.20);
            color: #fff;
            padding: 12px 14px;
            border-radius: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: #6CB604;
            box-shadow: 0 0 0 2px rgba(108,182,4,0.15);
        }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6CB604;
            color: #0A0A0A;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(108,182,4,0.4); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .msg-box {
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
        }
        .msg-error { background: rgba(255,76,0,0.1); border: 0.5px solid rgba(255,76,0,0.3); color: #FF6B4A; }
        .msg-success { background: rgba(108,182,4,0.1); border: 0.5px solid rgba(108,182,4,0.3); color: #6CB604; }

        .forgot-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 16px;
        }
        .forgot-link a {
            font-size: 0.75rem;
            color: rgba(108,182,4,0.7);
            transition: color 0.2s;
        }
        .forgot-link a:hover { color: #6CB604; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 4L44 24L24 44L4 24L24 4Z" fill="rgba(108,182,4,0.15)"/>
                <path d="M24 8L40 24L24 40L8 24L24 8Z" stroke="#6CB604" stroke-width="1.5" fill="none"/>
                <text x="24" y="29" text-anchor="middle" fill="#6CB604" font-family="Orbitron" font-weight="900" font-size="16">N</text>
            </svg>
            <h1>NOVA GAMING NETWORK</h1>
            <p>Staff Portal</p>
        </div>

        <div class="msg-box msg-error" id="msg-error"></div>
        <div class="msg-box msg-success" id="msg-success"></div>

        <form id="auth-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="inp-email" placeholder="you@nova.gg" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="inp-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div class="forgot-link">
                <a href="#" id="forgot-btn">Forgot password?</a>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">
                SIGN IN
            </button>

            <div style="text-align:center; margin: 24px 0; position:relative;">
                <hr style="border:none; border-top:0.5px solid rgba(255,255,255,0.1);">
                <span style="position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:#0F0F0F; padding:0 10px; font-size:0.75rem; color:rgba(255,255,255,0.4);">OR</span>
            </div>

            <button type="button" class="btn-submit" id="btn-google" style="background:#fff; color:#0A0A0A; border:1px solid #ddd; margin-top:0;">
                <iconify-icon icon="logos:google-icon"></iconify-icon> SIGN IN WITH GOOGLE
            </button>
        </form>
    </div>

    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script type="module">
        import { supabase } from '/src/supabase.js';
        import { signIn, signInWithGoogle, getSession, getUserRole, bootstrapOwner, resetPassword } from '/src/auth.js';

        // If already logged in, redirect
        const session = await getSession();
        if (session) {
            await redirectByRole();
        }

        async function redirectByRole() {
            let role = await getUserRole();
            if (!role) role = await bootstrapOwner();

            if (role === 'owner') window.location.href = '/users.html';
            else if (role === 'admin') window.location.href = '/upload.html';
            else if (role === 'mod') window.location.href = '/dashboard.html';
            else {
                showError('Access Restricted. Contact equeszero@gmail.com to request access.');
            }
        }

        function showError(m) {
            const e = document.getElementById('msg-error');
            e.textContent = m; e.style.display = 'block';
            document.getElementById('msg-success').style.display = 'none';
        }
        function showSuccess(m) {
            const e = document.getElementById('msg-success');
            e.textContent = m; e.style.display = 'block';
            document.getElementById('msg-error').style.display = 'none';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin">⟳</span> SIGNING IN...';

            const email = document.getElementById('inp-email').value.trim();
            const password = document.getElementById('inp-password').value;

            try {
                await signIn(email, password);
                await redirectByRole();
            } catch (err) {
                showError(err.message || 'Sign in failed.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'SIGN IN';
            }
        });

        document.getElementById('forgot-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('inp-email').value.trim();
            if (!email) { showError('Enter your email first.'); return; }
            try {
                await resetPassword(email);
                showSuccess('Password reset email sent!');
            } catch (err) {
                showError(err.message || 'Failed to send reset email.');
            }
        });

        document.getElementById('btn-google').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-google');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin">⟳</span> REDIRECTING...';
            try {
                await signInWithGoogle();
            } catch (err) {
                showError(err.message || 'Google Sign In failed.');
                btn.disabled = false;
                btn.innerHTML = '<iconify-icon icon="logos:google-icon"></iconify-icon> SIGN IN WITH GOOGLE';
            }
        });
    </script>
</body>
</html>
