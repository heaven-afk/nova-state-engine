<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OCR Review — Nova Stat Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g fill="var(--accent-primary)">
                            <path d="M68 5C61 5 57 11 60 17L83 45C86 49 92 49 95 45L97 42C101 37 101 29 96 24L79 7C76 4 72 5 68 5Z" />
                            <path d="M12 2C5 2 1 8 4 14L86 96C89 99 95 99 98 96L99 95C102 91 102 83 97 78L23 4C20 1 16 2 12 2Z" />
                            <path d="M3 58C-1 63 -1 71 4 76L21 93C24 96 28 95 32 95C39 95 43 89 40 83L17 55C14 51 8 51 5 55L3 58Z" />
                        </g>
                    </svg>
                </div>
                <span class="brand-text">NOVA GAMING</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">MAIN</div>
                <a href="/" class="nav-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard" class="nav-icon"></iconify-icon><span>Dashboard</span></a>
                <a href="/weeks.html" class="nav-item" data-page="weeks"><iconify-icon icon="lucide:calendar-days" class="nav-icon"></iconify-icon><span>Weeks</span></a>
                <div class="nav-section">ANALYSIS</div>
                <a href="/ocr-review.html" class="nav-item active" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye" class="nav-icon"></iconify-icon><span>OCR Review</span></a>
                <a href="/leaderboards.html" class="nav-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy" class="nav-icon"></iconify-icon><span>Leaderboards</span></a>
                <a href="/exports.html" class="nav-item" data-page="exports"><iconify-icon icon="lucide:download-cloud" class="nav-icon"></iconify-icon><span>Exports</span></a>
                <div class="nav-section">SYSTEM</div>
                <a href="/settings.html" class="nav-item" data-page="settings"><iconify-icon icon="lucide:settings" class="nav-icon"></iconify-icon><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><button data-action="signout" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;gap:6px;"><iconify-icon icon="lucide:log-out"></iconify-icon> Sign Out</button></div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <a class="btn-icon" id="back-btn" href="/weeks.html"><iconify-icon icon="lucide:arrow-left"></iconify-icon></a>
                    <h1 class="page-title">OCR Review</h1>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm" id="btn-approve" style="display:none;">
                        <iconify-icon icon="lucide:check"></iconify-icon> Approve All
                    </button>
                    <div class="user-profile"><div class="avatar">U</div><div class="user-info"><span class="user-name">User</span><span class="user-role">Member</span></div></div>
                </div>
            </header>

            <main class="page-content">
                <div id="no-lobby" class="empty-state">
                    <iconify-icon icon="lucide:scan-eye"></iconify-icon>
                    <h2>No Lobby Selected</h2>
                    <p>Run OCR from a day view to review extracted data here.</p>
                    <a href="/weeks.html" class="btn btn-primary">Go to Weeks</a>
                </div>

                <div id="review-content" style="display:none;">
                    <!-- Image preview -->
                    <div class="card mb-md">
                        <div class="card-header"><h2 class="card-title">Uploaded Screenshots</h2></div>
                        <div class="card-body">
                            <div class="thumb-grid" id="review-images"></div>
                        </div>
                    </div>

                    <!-- Extracted Records -->
                    <div class="section-header">
                        <h2 class="section-title">Extracted Players</h2>
                        <span class="badge badge-reviewing" id="record-count">0 records</span>
                    </div>

                    <div id="records-list" class="flex flex-col gap-sm"></div>

                    <!-- Approve Button (Mobile) -->
                    <button class="btn btn-primary btn-block mt-lg" id="btn-approve-mobile" style="display:none;">
                        <iconify-icon icon="lucide:check-check"></iconify-icon> Approve & Save Stats
                    </button>
                </div>
            </main>
        </div>
    </div>

    <nav class="bottom-tabs">
        <a href="/" class="tab-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard"></iconify-icon><span>Home</span></a>
        <a href="/weeks.html" class="tab-item" data-page="weeks"><iconify-icon icon="lucide:calendar-days"></iconify-icon><span>Weeks</span></a>
        <a href="/ocr-review.html" class="tab-item active" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye"></iconify-icon><span>OCR</span></a>
        <a href="/leaderboards.html" class="tab-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy"></iconify-icon><span>Ranks</span></a>
        <a href="/settings.html" class="tab-item" data-page="settings"><iconify-icon icon="lucide:settings"></iconify-icon><span>More</span></a>
    </nav>

    <script type="module">
        import { initApp, showToast } from '/src/router.js';
        import { getLobby, getOCRRecordsByLobby, updateOCRRecord, deleteOCRRecord, approveLobbyStats } from '/src/db.js';

        await initApp('ocr-review');

        const params = new URLSearchParams(window.location.search);
        const lobbyId = params.get('lobbyId');
        const weekId = params.get('weekId');
        const dayId = params.get('dayId');

        if (!lobbyId) {
            document.getElementById('no-lobby').style.display = 'block';
        } else {
            document.getElementById('no-lobby').style.display = 'none';
            document.getElementById('review-content').style.display = 'block';
            if (weekId) document.getElementById('back-btn').href = `/day-view.html?weekId=${weekId}&dayId=${dayId}`;
            loadReview();
        }

        async function loadReview() {
            try {
                const lobby = await getLobby(lobbyId);
                const records = await getOCRRecordsByLobby(lobbyId);

                // Show images
                const images = lobby.images || [];
                document.getElementById('review-images').innerHTML = images.map((src, i) =>
                    `<div class="thumb"><img src="${src}" alt="Screenshot ${i + 1}"></div>`
                ).join('') || '<p class="text-muted">No images</p>';

                // Show records
                document.getElementById('record-count').textContent = `${records.length} records`;
                renderRecords(records);

                // Show approve buttons
                if (records.length > 0) {
                    document.getElementById('btn-approve').style.display = 'inline-flex';
                    document.getElementById('btn-approve-mobile').style.display = 'flex';
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        function renderRecords(records) {
            const list = document.getElementById('records-list');
            
            // Group records by team slot with a 4-player limit
            const groups = {};
            const uncategorized = [];
            const teamCounts = {};

            records.forEach(r => {
                const teamId = r.teamSlot;
                const label = teamId ? `Team ${teamId}` : 'Uncategorized';
                
                if (teamId) {
                    const count = teamCounts[teamId] || 0;
                    if (count < 4) {
                        if (!groups[label]) groups[label] = [];
                        groups[label].push(r);
                        teamCounts[teamId] = count + 1;
                    } else {
                        // Overflow to Uncategorized
                        uncategorized.push(r);
                    }
                } else {
                    uncategorized.push(r);
                }
            });

            // Sort team names correctly
            const teamKeys = Object.keys(groups).sort((a, b) => {
                return a.localeCompare(b, undefined, { numeric: true });
            });

            // Put Uncategorized at the end
            const allKeys = [...teamKeys];
            if (uncategorized.length > 0) {
                groups['Uncategorized'] = uncategorized;
                allKeys.push('Uncategorized');
            }

            list.innerHTML = allKeys.map(groupName => {
                const groupRecords = groups[groupName];
                const isUncategorized = groupName === 'Uncategorized';
                const headerColor = isUncategorized ? 'var(--accent-red)' : 'var(--primary)';
                
                const groupHtml = groupRecords.map(r => {
                    const confClass = r.confidence < 0.7 ? 'low-confidence' : '';
                    const dupClass = r.isDuplicate ? 'duplicate' : '';
                    const uncClass = isUncategorized ? 'is-uncategorized' : '';
                    
                    return `<div class="ocr-record ${confClass} ${dupClass} ${uncClass}" id="rec-${r.id}" 
                                 style="${isUncategorized ? 'border-left: 3px solid var(--accent-red);' : ''}">
                        <div class="data-item-content" style="flex:1;">
                            <input type="text" class="form-input" value="${r.normalizedName}" data-id="${r.id}" data-field="name"
                                style="background:transparent;border:1px solid var(--border-subtle);padding:8px 12px;margin-bottom:6px;font-weight:600;">
                            <div class="flex items-center gap-sm">
                                <span class="text-muted" style="font-size:0.78rem;">Kills:</span>
                                <input type="number" class="form-input" value="${r.normalizedKills}" data-id="${r.id}" data-field="kills"
                                    style="background:transparent;border:1px solid var(--border-subtle);padding:6px 10px;width:70px;font-family:var(--font-heading);font-weight:700;">
                                <span class="text-muted" style="font-size:0.72rem;margin-left:auto;">${r.sourceImage}</span>
                            </div>
                        </div>
                        <button class="btn-icon" onclick="window.deleteRecord('${r.id}')" style="color:var(--accent-red);">
                            <iconify-icon icon="lucide:trash-2"></iconify-icon>
                        </button>
                    </div>`;
                }).join('');

                return `
                    <div class="team-group card mb-md" id="group-${groupName.replace(/\s+/g, '-')}">
                        <div class="card-header" style="background:rgba(255,255,255,0.03);padding:8px 16px;border-bottom:1px solid var(--border-subtle);">
                            <h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;color:${headerColor};margin:0;">${groupName}</h3>
                        </div>
                        <div class="card-body flex flex-col gap-sm" style="padding:12px;">
                            ${groupHtml}
                        </div>
                    </div>
                `;
            }).join('');

            // Inline edit handlers
            list.querySelectorAll('input[data-id]').forEach(inp => {
                inp.addEventListener('change', async () => {
                    const id = inp.dataset.id;
                    const field = inp.dataset.field;
                    try {
                        const updates = {};
                        if (field === 'name') updates.normalizedName = inp.value;
                        if (field === 'kills') updates.normalizedKills = parseInt(inp.value) || 0;
                        await updateOCRRecord(id, updates);
                    } catch (e) {
                        showToast('Save error: ' + e.message, 'error');
                    }
                });
            });
        }

        window.deleteRecord = async (id) => {
            try {
                await deleteOCRRecord(id);
                document.getElementById(`rec-${id}`)?.remove();
                showToast('Record removed', 'info');
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        };

        async function handleApprove() {
            if (!weekId || !dayId) return showToast('Missing week/day context', 'error');

            const records = await getOCRRecordsByLobby(lobbyId);
            const players = records.map(r => ({
                normalizedName: r.normalizedName,
                normalizedKills: r.normalizedKills,
                teamSlot: r.teamSlot
            }));

            try {
                await approveLobbyStats(weekId, dayId, lobbyId, players);
                showToast('Stats approved and saved!', 'success');
                setTimeout(() => window.location.href = `/day-view.html?weekId=${weekId}&dayId=${dayId}`, 1000);
            } catch (e) {
                showToast('Approve error: ' + e.message, 'error');
            }
        }

        document.getElementById('btn-approve').addEventListener('click', handleApprove);
        document.getElementById('btn-approve-mobile').addEventListener('click', handleApprove);
    </script>
</body>
</html>
