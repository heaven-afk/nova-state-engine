<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gaming Network</title>
    <meta name="description" content="Nova Gaming Network — Competitive CODM Scrims Stats Platform">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Barlow', sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            overflow-y: auto;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            background: #0F0F0F;
            border: 0.5px solid rgba(108,182,4,0.20);
            border-top: 2px solid #6CB604;
            border-radius: 4px;
            padding: 40px 32px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo img {
            width: 120px;
            height: 120px;
            margin-bottom: 12px;
        }

        .login-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.68rem;
            color: rgba(108,182,4,0.53);
            letter-spacing: 0.35em;
            margin-bottom: 0;
        }

        .login-logo p {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #0A0A0A;
            border: 0.5px solid rgba(108,182,4,0.20);
            color: #fff;
            padding: 12px 40px 12px 14px;
            border-radius: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 44px;
        }
        .form-input:focus {
            border-color: #6CB604;
            box-shadow: 0 0 0 2px rgba(108,182,4,0.15);
        }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6CB604;
            color: #0A0A0A;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            min-height: 46px;
            touch-action: manipulation;
        }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(108,182,4,0.4); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .msg-box {
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
        }
        .msg-error { background: rgba(255,76,0,0.1); border: 0.5px solid rgba(255,76,0,0.3); color: #FF6B4A; }
        .msg-success { background: rgba(108,182,4,0.1); border: 0.5px solid rgba(108,182,4,0.3); color: #6CB604; }

        .forgot-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 16px;
        }
        .forgot-link a {
            font-size: 0.75rem;
            color: rgba(108,182,4,0.7);
            transition: color 0.2s;
        }
        .forgot-link a:hover { color: #6CB604; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; display: inline-block; }

        /* Login entrance animations */
        @keyframes loginLogoIn {
            0%   { opacity: 0; transform: scale(0.85); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1);    filter: blur(0px); }
        }
        @keyframes loginFormIn {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            animation: loginLogoIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .login-card {
            animation: loginFormIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }

        @media (prefers-reduced-motion: reduce) {
            .login-logo, .login-card { animation: none; opacity: 1; }
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 16px 0;
            }
            .login-card {
                margin: 0 12px;
                padding: 28px 18px;
            }
            .login-logo { margin-bottom: 24px; }
            .login-logo h1 {
                font-size: 0.88rem;
                line-height: 1.35;
            }
            .form-input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/brand/nova_logo_full_transparent.png" alt="Nova Gaming Network" width="120" height="120">
            <h1>NETWORK</h1>
        </div>

        <div class="msg-box msg-error" id="msg-error"></div>
        <div class="msg-box msg-success" id="msg-success"></div>

        <form id="auth-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="inp-email" placeholder="you@nova.gg" required autocomplete="email">
            </div>
            <div class="form-group" style="position: relative;">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="inp-password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" id="toggle-password" style="position: absolute; right: 12px; top: 30px; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 30px; width: 30px; z-index: 2; padding: 4px;">
                    <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <div class="forgot-link">
                <a href="#" id="forgot-btn">Forgot password?</a>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">
                SIGN IN
            </button>

            <div style="text-align:center; margin: 24px 0; position:relative;">
                <hr style="border:none; border-top:0.5px solid rgba(255,255,255,0.1);">
                <span style="position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:#0F0F0F; padding:0 10px; font-size:0.75rem; color:rgba(255,255,255,0.4);">OR</span>
            </div>

            <button type="button" class="btn-submit" id="btn-google" style="background:#fff; color:#0A0A0A; border:1px solid #ddd; margin-top:0;">
                <iconify-icon icon="logos:google-icon"></iconify-icon> SIGN IN WITH GOOGLE
            </button>
        </form>
    </div>

    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script type="module">
        import { signIn, signInWithGoogle, getSession, getUserRole, bootstrapOwner, resetPassword, onAuthStateChange, isProfileComplete, getAuthProvider } from '/src/auth.js';

        // Handle OAuth redirects (Google Sign-In callback) and existing sessions
        let redirecting = false;
        const { data: { subscription } } = onAuthStateChange(async (event, session) => {
            if (redirecting) return;
            if (event === 'SIGNED_IN' && session) {
                redirecting = true;
                // Clean hash fragments from URL left by OAuth redirect
                let isInvite = false;
                if (window.location.hash) {
                    if (window.location.hash.includes('type=invite')) {
                        isInvite = true;
                    }
                    history.replaceState(null, '', window.location.pathname);
                }
                try {
                    await redirectByRole(session.user, isInvite);
                } catch (err) {
                    redirecting = false;
                    showError(err.message || 'Signed in, but failed to redirect.');
                }
            }
        });

        // Also check for an existing session on page load
        (async () => {
            try {
                const session = await withTimeout(getSession(), 7000, 'Session check timed out. Try signing in again.');
                if (session && !redirecting) {
                    redirecting = true;
                    await redirectByRole(session.user, false);
                }
            } catch (err) {
                showError(err.message || 'Could not check your session. You can still sign in below.');
            }
        })();

        function withTimeout(promise, ms, message) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
            ]);
        }

        async function redirectByRole(user = null, isInvite = false) {
            let role = await withTimeout(getUserRole(user), 15000, 'Role lookup timed out.');
            if (!role) role = await withTimeout(bootstrapOwner(user), 15000, 'Owner bootstrap timed out.');

            const profileUrl = isInvite ? '/profile.html?invite=true' : '/profile.html';

            // If the user has no role, they are a new user
            // Check if they need to complete their profile first
            if (!role) {
                // New user with no role — send to profile page to complete setup
                window.location.href = profileUrl;
                return;
            }

            // User has a role — check if profile is complete
            if (!isProfileComplete(user)) {
                window.location.href = profileUrl;
                return;
            }

            if (role === 'owner') window.location.href = '/users.html';
            else if (role === 'admin') window.location.href = '/upload.html';
            else window.location.href = '/dashboard.html';
        }

        function showError(m) {
            const e = document.getElementById('msg-error');
            e.textContent = m; e.style.display = 'block';
            document.getElementById('msg-success').style.display = 'none';
        }
        function showSuccess(m) {
            const e = document.getElementById('msg-success');
            e.textContent = m; e.style.display = 'block';
            document.getElementById('msg-error').style.display = 'none';
        }

        async function handleEmailSignIn(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="spin">⟳</span> SIGNING IN...';

            const email = document.getElementById('inp-email').value.trim();
            const password = document.getElementById('inp-password').value;

            try {
                if (!email || !password) throw new Error('empty');
                const sessionData = await withTimeout(signIn(email, password), 15000, 'Sign in timed out. Check your connection and try again.');
                await redirectByRole(sessionData.user);
            } catch (err) {
                const msg = err.message || '';
                if (msg === 'empty') {
                    showError('Enter your email and password.');
                } else if (msg.includes('timed out')) {
                    showError(msg);
                } else {
                    showError('Incorrect email or password.');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'SIGN IN';
            }
        }

        document.getElementById('auth-form').addEventListener('submit', handleEmailSignIn);
        
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('inp-password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePassword.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
        });

        document.getElementById('forgot-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('inp-email').value.trim();
            if (!email) { showError('Enter your email first.'); return; }
            try {
                await resetPassword(email);
                showSuccess('Password reset email sent!');
            } catch (err) {
                showError(err.message || 'Failed to send reset email.');
            }
        });

        document.getElementById('btn-google').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-google');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin">⟳</span> REDIRECTING...';
            try {
                await signInWithGoogle();
            } catch (err) {
                showError(err.message || 'Google Sign In failed.');
                btn.disabled = false;
                btn.innerHTML = '<iconify-icon icon="logos:google-icon"></iconify-icon> SIGN IN WITH GOOGLE';
            }
        });
    </script>
</body>
</html>
