<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>User Management — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .modal-actions { display:flex; gap:12px; margin-top:24px; }
        @media (max-width: 520px) {
            .modal-actions { flex-direction: column-reverse; }
            #btn-add-staff { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-body">
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Staff</div>
                <div class="metric-value" id="m-total">--</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">STAFF DIRECTORY</span>
                <button class="btn btn-primary btn-sm" id="btn-add-staff"><iconify-icon icon="lucide:user-plus"></iconify-icon> Add Staff</button>
            </div>
            <div class="card-body">
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Assigned Date</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <tr><td colspan="4" class="text-center text-muted" style="padding:24px;">Loading staff...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add User Modal: kept inside page-body because injectLayout preserves only page-body content. -->
        <div class="modal-overlay" id="modal-add">
            <div class="modal-box">
                <h3 class="modal-title">GRANT STAFF ACCESS</h3>
                <div class="text-muted mb-md" style="font-size:0.8rem;">
                    Enter the exact email address. The user must sign in using this email to access their role.
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="inp-new-email" placeholder="user@nova.gg">
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="inp-new-role">
                        <option value="mod">Moderator (Dashboard & Leaderboards)</option>
                        <option value="admin">Administrator (+ OCR Uploads & GFX)</option>
                        <option value="owner">Owner (Full Access & User Management)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary flex" id="btn-cancel" style="flex:1;">CANCEL</button>
                    <button class="btn btn-primary flex" id="btn-save" style="flex:1;">GRANT ACCESS</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { supabase } from '/src/supabase.js';

        (async () => {
            const profile = await requireRole('owner');
            if (!profile) return;
            injectLayout('users', 'USER MANAGEMENT', profile);

            const modal = document.getElementById('modal-add');
            if (!modal) {
                showToast('Staff modal failed to load. Refresh and try again.', 'error');
                return;
            }
            document.getElementById('btn-add-staff').addEventListener('click', () => modal.classList.add('show'));
            document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.remove('show'));

            async function loadUsers() {
                try {
                    const { data, error } = await supabase.from('user_roles').select('*').order('role');
                    if (error) throw error;

                    document.getElementById('m-total').textContent = data.length;

                    const tbody = document.getElementById('users-tbody');
                    tbody.innerHTML = data.map(u => `
                        <tr>
                            <td style="font-weight:600;">${u.email || 'Unknown User'}</td>
                            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                            <td class="font-data">${new Date(u.assigned_at).toLocaleDateString()}</td>
                            <td style="text-align:right;">
                                ${u.email !== profile.email ? `<button class="btn-icon text-red btn-del" data-id="${u.id}"><iconify-icon icon="lucide:trash-2"></iconify-icon></button>` : '<span class="text-muted" style="font-size:0.7rem;">(You)</span>'}
                            </td>
                        </tr>
                    `).join('');

                    document.querySelectorAll('.btn-del').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            if (!confirm('Revoke access for this user?')) return;
                            const id = e.currentTarget.dataset.id;
                            const { error: delErr } = await supabase.from('user_roles').delete().eq('id', id);
                            if (delErr) showToast('Delete failed', 'error');
                            else { showToast('Access revoked', 'success'); loadUsers(); }
                        });
                    });
                } catch(e) {
                    console.error(e);
                    showToast('Failed to load staff directory', 'error');
                }
            }

            document.getElementById('btn-save').addEventListener('click', async () => {
                const email = document.getElementById('inp-new-email').value.trim().toLowerCase();
                const role = document.getElementById('inp-new-role').value;
                
                if (!email) return showToast('Enter email', 'error');

                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.textContent = 'SAVING...';

                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) throw new Error('Session expired. Please sign in again.');

                    const resp = await fetch('/api/staff', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`
                        },
                        body: JSON.stringify({ email, role })
                    });

                    const result = await resp.json().catch(() => ({}));
                    if (!resp.ok) throw new Error(result.error || 'Failed to grant staff access');

                    showToast(result.invited ? 'Invite sent and staff access granted' : 'Staff access granted', 'success');
                    document.getElementById('inp-new-email').value = '';
                    document.getElementById('inp-new-role').value = 'mod';
                    modal.classList.remove('show');
                    await loadUsers();
                } catch(e) {
                    showToast(e.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'GRANT ACCESS';
                }
            });

            loadUsers();
        })();
    </script>
</body>
</html>
