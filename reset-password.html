<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>Reset Password — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Barlow', sans-serif;
            background: #0A0A0A;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .reset-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            background: #0F0F0F;
            border: 0.5px solid rgba(108,182,4,0.20);
            border-top: 2px solid #6CB604;
            border-radius: 4px;
            padding: 40px 32px;
            animation: formIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
            animation: logoIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .logo-area img { width: 100px; height: 100px; margin-bottom: 12px; }
        .logo-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.68rem;
            color: rgba(108,182,4,0.53);
            letter-spacing: 0.35em;
        }
        .logo-area p {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 8px;
        }
        @keyframes logoIn {
            0%   { opacity: 0; transform: scale(0.85); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1);    filter: blur(0px); }
        }
        @keyframes formIn {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #0A0A0A;
            border: 0.5px solid rgba(108,182,4,0.20);
            color: #fff;
            padding: 12px 40px 12px 14px;
            border-radius: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 44px;
        }
        .form-input:focus {
            border-color: #6CB604;
            box-shadow: 0 0 0 2px rgba(108,182,4,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6CB604;
            color: #0A0A0A;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            min-height: 46px;
        }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(108,182,4,0.4); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
        .msg-box {
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .msg-error { background: rgba(255,76,0,0.1); border: 0.5px solid rgba(255,76,0,0.3); color: #FF6B4A; }
        .msg-success { background: rgba(108,182,4,0.1); border: 0.5px solid rgba(108,182,4,0.3); color: #6CB604; }
        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute; right: 12px; top: 30px;
            background: none; border: none;
            color: rgba(255,255,255,0.4); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            height: 30px; width: 30px; z-index: 2; padding: 4px;
        }
        .strength-bar {
            height: 3px; border-radius: 2px; margin-top: 6px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .strength-fill {
            height: 100%; width: 0%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
        }
        .strength-text {
            font-size: 0.7rem; margin-top: 4px;
            font-family: 'Barlow Condensed', sans-serif;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo-area">
            <img src="/assets/brand/nova_logo_full_transparent.png" alt="Nova Gaming Network" width="100" height="100">
            <h1>NETWORK</h1>
            <p>Reset Your Password</p>
        </div>

        <div class="msg-box msg-error" id="msg-error"></div>
        <div class="msg-box msg-success" id="msg-success"></div>

        <form id="reset-form">
            <div class="form-group password-wrapper">
                <label class="form-label">New Password</label>
                <input type="password" class="form-input" id="inp-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="inp-password">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-text" id="strength-text"></div>
            </div>
            <div class="form-group password-wrapper">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-input" id="inp-password-confirm" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="inp-password-confirm">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">
                UPDATE PASSWORD
            </button>
        </form>
    </div>

    <script type="module">
        import { supabase } from '/src/supabase.js';

        const errBox = document.getElementById('msg-error');
        const successBox = document.getElementById('msg-success');
        const passwordInput = document.getElementById('inp-password');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');

        function showError(m) { errBox.textContent = m; errBox.style.display = 'block'; successBox.style.display = 'none'; }
        function showSuccess(m) { successBox.textContent = m; successBox.style.display = 'block'; errBox.style.display = 'none'; }

        // Password strength indicator
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const percent = (score / 5) * 100;
            const colors = ['#ff4c00', '#ff4c00', '#ffa500', '#ffd700', '#6CB604', '#6CB604'];
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            strengthFill.style.width = percent + '%';
            strengthFill.style.background = colors[score];
            strengthText.textContent = labels[score] || '';
            strengthText.style.color = colors[score];
        });

        // Password toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const eyeOpen = btn.querySelector('.eye-open');
                const eyeClosed = btn.querySelector('.eye-closed');
                const isPassword = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPassword ? 'text' : 'password');
                eyeOpen.style.display = isPassword ? 'none' : 'block';
                eyeClosed.style.display = isPassword ? 'block' : 'none';
            });
        });

        // Check for recovery session on page load
        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                console.log('[Reset] Recovery session detected');
            }
        });

        // Handle form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('inp-password').value;
            const confirm = document.getElementById('inp-password-confirm').value;
            const btn = document.getElementById('btn-submit');

            errBox.style.display = 'none';
            successBox.style.display = 'none';

            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'UPDATING...';

            try {
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;

                showSuccess('Password updated successfully! Redirecting...');
                setTimeout(() => window.location.href = '/ngn-access.html', 2500);
            } catch (err) {
                showError(err.message || 'Failed to update password. The reset link may have expired.');
                btn.disabled = false;
                btn.textContent = 'UPDATE PASSWORD';
            }
        });
    </script>
</body>
</html>
