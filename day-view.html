<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Day View — Nova Stat Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><div class="brand-logo">N</div><span class="brand-text">NOVA STAT ENGINE</span></div>
            <nav class="sidebar-nav">
                <div class="nav-section">MAIN</div>
                <a href="/" class="nav-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard" class="nav-icon"></iconify-icon><span>Dashboard</span></a>
                <a href="/weeks.html" class="nav-item active" data-page="weeks"><iconify-icon icon="lucide:calendar-days" class="nav-icon"></iconify-icon><span>Weeks</span></a>
                <div class="nav-section">ANALYSIS</div>
                <a href="/ocr-review.html" class="nav-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye" class="nav-icon"></iconify-icon><span>OCR Review</span></a>
                <a href="/leaderboards.html" class="nav-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy" class="nav-icon"></iconify-icon><span>Leaderboards</span></a>
                <a href="/exports.html" class="nav-item" data-page="exports"><iconify-icon icon="lucide:download-cloud" class="nav-icon"></iconify-icon><span>Exports</span></a>
                <div class="nav-section">SYSTEM</div>
                <a href="/settings.html" class="nav-item" data-page="settings"><iconify-icon icon="lucide:settings" class="nav-icon"></iconify-icon><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><button data-action="signout" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;gap:6px;"><iconify-icon icon="lucide:log-out"></iconify-icon> Sign Out</button></div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <a class="btn-icon" id="back-btn"><iconify-icon icon="lucide:arrow-left"></iconify-icon></a>
                    <h1 class="page-title" id="day-title">Day</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-profile"><div class="avatar">U</div><div class="user-info"><span class="user-name">User</span><span class="user-role">Member</span></div></div>
                </div>
            </header>

            <main class="page-content">
                <div id="lobbies-container" class="flex flex-col gap-md"></div>
            </main>
        </div>
    </div>

    <!-- Screenshot Modal -->
    <div class="modal-overlay" id="modal-screenshots">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="flex justify-between items-center mb-md">
                <h2 class="modal-title" style="margin:0;">Lobby Screenshots</h2>
                <button class="btn-icon" onclick="window.closeScreenshotsModal()"><iconify-icon icon="lucide:x"></iconify-icon></button>
            </div>
            <div id="screenshots-container" class="flex flex-col gap-md"></div>
        </div>
    </div>

    <nav class="bottom-tabs">
        <a href="/" class="tab-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard"></iconify-icon><span>Home</span></a>
        <a href="/weeks.html" class="tab-item active" data-page="weeks"><iconify-icon icon="lucide:calendar-days"></iconify-icon><span>Weeks</span></a>
        <a href="/ocr-review.html" class="tab-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye"></iconify-icon><span>OCR</span></a>
        <a href="/leaderboards.html" class="tab-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy"></iconify-icon><span>Ranks</span></a>
        <a href="/settings.html" class="tab-item" data-page="settings"><iconify-icon icon="lucide:settings"></iconify-icon><span>More</span></a>
    </nav>

    <script type="module">
        import { initApp, showToast } from '/src/router.js';
        import { getLobbiesByDay, updateLobbyImages, saveOCRRecords } from '/src/db.js';
        import { runOCRExtraction } from '/src/ocr-engine.js';

        await initApp('weeks');

        const params = new URLSearchParams(window.location.search);
        const weekId = params.get('weekId');
        const dayId = params.get('dayId');
        const dayNum = params.get('day') || '?';

        if (!weekId || !dayId) window.location.href = '/weeks.html';

        document.getElementById('day-title').textContent = `Day ${dayNum}`;
        document.getElementById('back-btn').href = `/week-view.html?id=${weekId}`;

        const lobbyImages = {}; // lobbyId -> base64[]

        async function load() {
            const lobbies = await getLobbiesByDay(dayId);
            const container = document.getElementById('lobbies-container');
            container.innerHTML = '';

            lobbies.forEach(lobby => {
                lobbyImages[lobby.id] = lobby.images || [];
                const card = document.createElement('div');
                card.className = 'lobby-card';
                card.id = `lobby-${lobby.id}`;
                card.innerHTML = `
                    <div class="lobby-header">
                        <div class="lobby-title">Lobby ${lobby.lobby_number}</div>
                        <span class="badge badge-${lobby.status}">${lobby.status}</span>
                    </div>

                    <div class="upload-zone" id="drop-${lobby.id}" onclick="document.getElementById('file-${lobby.id}').click()">
                        <iconify-icon icon="lucide:image-plus"></iconify-icon>
                        <div class="upload-zone-text">Tap to upload scoreboard screenshots</div>
                        <input type="file" id="file-${lobby.id}" accept="image/*" multiple hidden>
                    </div>

                    <div class="thumb-grid mt-sm" id="thumbs-${lobby.id}"></div>

                    <div class="flex gap-sm mt-md">
                        <button class="btn btn-secondary btn-sm flex-1" id="review-ss-btn-${lobby.id}" disabled onclick="window.openScreenshotsModal('${lobby.id}')">
                            <iconify-icon icon="lucide:image"></iconify-icon> Images
                        </button>
                        <button class="btn btn-primary btn-sm flex-1" id="ocr-btn-${lobby.id}" disabled onclick="window.runOCR('${lobby.id}')">
                            <iconify-icon icon="lucide:scan-eye"></iconify-icon> Run OCR
                        </button>
                        ${lobby.status === 'reviewing' || lobby.status === 'approved' ? `
                        <a href="/ocr-review.html?lobbyId=${lobby.id}&weekId=${weekId}&dayId=${dayId}" class="btn btn-secondary btn-sm flex-1">
                            <iconify-icon icon="lucide:eye"></iconify-icon> Review
                        </a>` : ''}
                    </div>
                `;
                container.appendChild(card);

                // File input handler
                const fileInput = document.getElementById(`file-${lobby.id}`);
                fileInput.addEventListener('change', (e) => handleFiles(lobby.id, e.target.files));

                // Drag & drop
                const dropZone = document.getElementById(`drop-${lobby.id}`);
                dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
                dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
                dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(lobby.id, e.dataTransfer.files); });

                // Render existing images
                renderThumbs(lobby.id);
            });
        }

        function handleFiles(lobbyId, files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    lobbyImages[lobbyId].push(e.target.result);
                    renderThumbs(lobbyId);
                };
                reader.readAsDataURL(file);
            });
        }

        function renderThumbs(lobbyId) {
            const grid = document.getElementById(`thumbs-${lobbyId}`);
            const btn = document.getElementById(`ocr-btn-${lobbyId}`);
            const imgs = lobbyImages[lobbyId] || [];

            grid.innerHTML = imgs.map((src, i) => `
                <div class="thumb" style="position:relative;">
                    <img src="${src}" alt="Screenshot ${i + 1}">
                    <button class="btn-icon" style="position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(17,19,32,0.8);color:var(--accent-red);font-size:1rem;" onclick="event.stopPropagation(); window.removeScreenshot('${lobbyId}', ${i}, false)">
                        <iconify-icon icon="lucide:x"></iconify-icon>
                    </button>
                </div>
            `).join('');

            btn.disabled = imgs.length === 0;
            const ssBtn = document.getElementById(`review-ss-btn-${lobbyId}`);
            if (ssBtn) ssBtn.disabled = imgs.length === 0;
        }

        window.openScreenshotsModal = function(lobbyId) {
            const container = document.getElementById('screenshots-container');
            const imgs = lobbyImages[lobbyId] || [];
            if (imgs.length === 0) {
                window.closeScreenshotsModal();
                return showToast('No screenshots to display.', 'info');
            }
            
            container.innerHTML = imgs.map((src, i) => `
                <div style="border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden;">
                    <div class="flex justify-between items-center" style="background: var(--bg-elevated); padding: 8px 12px; font-weight: 600; font-size: 0.9rem; border-bottom: 1px solid var(--border-subtle);">
                        <span>Screenshot ${i + 1}</span>
                        <button class="btn-icon" style="width:24px;height:24px;background:rgba(255,51,102,0.15);color:var(--accent-red);" onclick="window.removeScreenshot('${lobbyId}', ${i}, true)">
                            <iconify-icon icon="lucide:trash-2"></iconify-icon>
                        </button>
                    </div>
                    <img src="${src}" style="width: 100%; height: auto; display: block;" />
                </div>
            `).join('');
            
            document.getElementById('modal-screenshots').classList.add('show');
        };

        window.removeScreenshot = async function(lobbyId, index, isFromModal) {
            if (!confirm('Remove this screenshot?')) return;
            lobbyImages[lobbyId].splice(index, 1);
            
            // Sync with db to persist removal immediately
            try {
                await updateLobbyImages(lobbyId, lobbyImages[lobbyId]);
            } catch (e) {
                console.error('Failed to sync deletion to DB:', e);
            }

            renderThumbs(lobbyId);

            if (isFromModal) {
                // re-render modal or close if empty
                window.openScreenshotsModal(lobbyId);
            }
        };

        window.closeScreenshotsModal = function() {
            document.getElementById('modal-screenshots').classList.remove('show');
        };

        window.runOCR = async function(lobbyId) {
            const images = lobbyImages[lobbyId];
            if (!images?.length) return showToast('Upload screenshots first', 'error');

            const btn = document.getElementById(`ocr-btn-${lobbyId}`);
            btn.disabled = true;
            btn.innerHTML = '<iconify-icon icon="lucide:loader-2" class="spin"></iconify-icon> Extracting...';

            try {
                // Save images to DB and run OCR concurrently to save time
                const [_, records] = await Promise.all([
                    updateLobbyImages(lobbyId, images),
                    runOCRExtraction(images)
                ]);
                
                // Save OCR records
                await saveOCRRecords(lobbyId, records);

                showToast(`Extracted ${records.length} players!`, 'success');

                // Navigate to review
                window.location.href = `/ocr-review.html?lobbyId=${lobbyId}&weekId=${weekId}&dayId=${dayId}`;
            } catch (e) {
                showToast('OCR Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<iconify-icon icon="lucide:scan-eye"></iconify-icon> Run OCR';
            }
        };

        load();
    </script>
</body>
</html>
