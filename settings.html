<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="page-body">
        <div style="max-width: 800px; margin: 0 auto;">
            
            <div class="card mb-md">
                <div class="card-header"><span class="card-title">PLATFORM SETTINGS</span></div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Platform Name</label>
                        <input type="text" class="form-input" value="NOVA GAMING NETWORK" disabled>
                        <small class="text-muted mt-sm" style="display:block;">Currently locked to Nova brand tokens.</small>
                    </div>
                </div>
            </div>

            <div class="card mb-md">
                <div class="card-header"><span class="card-title">OCR CONFIGURATION</span></div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Name Matching Sensitivity (0.0 - 1.0)</label>
                        <input type="number" class="form-input" id="inp-ocr-sense" value="0.75" step="0.05" min="0.1" max="1.0">
                        <small class="text-muted mt-sm" style="display:block;">Lower values will aggressively group similar names as duplicates. Higher values require exact matches.</small>
                    </div>
                    <button class="btn btn-primary" id="btn-save-ocr">SAVE CONFIG</button>
                </div>
            </div>

            <div class="card" style="border-top-color: var(--alert-red);">
                <div class="card-header"><span class="card-title text-red">DANGER ZONE</span></div>
                <div class="card-body">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:600; font-size:0.9rem;">Factory Reset Database</div>
                            <div class="text-muted" style="font-size:0.8rem; margin-top:4px;">Deletes all sessions, match results, and player stats. Cannot be undone.</div>
                        </div>
                        <button class="btn btn-danger" id="btn-reset">PURGE DATA</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { supabase } from '/src/supabase.js';

        const profile = await requireRole('owner');
        if (!profile) throw new Error('Unauthorized');
        injectLayout('settings', 'SETTINGS', profile);

        // Load settings from local storage
        const sense = localStorage.getItem('nova_setting_ocr_sense') || '0.75';
        document.getElementById('inp-ocr-sense').value = sense;

        document.getElementById('btn-save-ocr').addEventListener('click', () => {
            const val = document.getElementById('inp-ocr-sense').value;
            localStorage.setItem('nova_setting_ocr_sense', val);
            showToast('OCR config saved', 'success');
        });

        document.getElementById('btn-reset').addEventListener('click', async () => {
            if (prompt('Type "PURGE" to confirm complete data deletion:') !== 'PURGE') return;
            
            try {
                // Delete all sessions (cascades to results and stats via foreign keys)
                const { error } = await supabase.from('scrims_sessions').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
                showToast('Database purged successfully', 'success');
            } catch(e) {
                showToast('Failed to purge: ' + e.message, 'error');
            }
        });
    </script>
</body>
</html>
