<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>Profile Setup — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <style>
        body {
            font-family: 'Barlow', sans-serif;
            background: #0A0A0A;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .profile-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            background: #0F0F0F;
            border: 0.5px solid rgba(108,182,4,0.20);
            border-top: 2px solid #6CB604;
            border-radius: 4px;
            padding: 40px 32px;
            animation: loginFormIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
            animation: loginLogoIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .logo-area img {
            width: 120px;
            height: 120px;
            margin-bottom: 12px;
        }
        .logo-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.68rem;
            color: rgba(108,182,4,0.53);
            letter-spacing: 0.35em;
            margin-bottom: 0;
        }
        .logo-area p {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 8px;
        }
        @keyframes loginLogoIn {
            0%   { opacity: 0; transform: scale(0.85); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1);    filter: blur(0px); }
        }
        @keyframes loginFormIn {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #0A0A0A;
            border: 0.5px solid rgba(108,182,4,0.20);
            color: #fff;
            padding: 12px 40px 12px 14px;
            border-radius: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 44px;
        }
        .form-input:focus {
            border-color: #6CB604;
            box-shadow: 0 0 0 2px rgba(108,182,4,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6CB604;
            color: #0A0A0A;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            min-height: 46px;
        }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(108,182,4,0.4); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="logo-area">
            <img src="/assets/brand/nova_logo_full_transparent.png" alt="Nova Gaming Network" width="120" height="120">
            <h1>NETWORK</h1>
            <p>Complete Your Profile</p>
        </div>

        <div id="msg-error" class="card mb-md" style="background:rgba(255,76,0,0.1); border-color:rgba(255,76,0,0.3); color:#FF6B4A; padding:10px; font-size:0.85rem; display:none;"></div>
        <div id="msg-success" class="card mb-md" style="background:rgba(108,182,4,0.1); border-color:rgba(108,182,4,0.3); color:#6CB604; padding:10px; font-size:0.85rem; display:none;"></div>

        <form id="profile-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="inp-email" placeholder="you@nova.gg" required>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="inp-username" placeholder="Enter username" required minlength="3">
            </div>
            <div class="form-group" style="position: relative;">
                <label class="form-label">Set Password</label>
                <input type="password" class="form-input" id="inp-password" placeholder="••••••••" required minlength="6">
                <button type="button" class="toggle-password" data-target="inp-password" style="position: absolute; right: 12px; top: 30px; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 30px; width: 30px; z-index: 2; padding: 4px;">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <div class="form-group" style="position: relative;">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" id="inp-password-confirm" placeholder="••••••••" required minlength="6">
                <button type="button" class="toggle-password" data-target="inp-password-confirm" style="position: absolute; right: 12px; top: 30px; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 30px; width: 30px; z-index: 2; padding: 4px;">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">
                SAVE PROFILE
            </button>
        </form>
    </div>

    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script type="module">
        import { supabase } from '/src/supabase.js';
        import { getSession } from '/src/auth.js';

        (async () => {
            // Check if we have an active session (e.g. clicked invite link)
            const session = await getSession();
            if (session) {
                document.getElementById('inp-email').value = session.user.email;
                document.getElementById('inp-email').disabled = true;
            }

            // Password toggle logic
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const targetId = btn.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    const eyeOpen = btn.querySelector('.eye-open');
                    const eyeClosed = btn.querySelector('.eye-closed');
                    const isPassword = input.getAttribute('type') === 'password';
                    input.setAttribute('type', isPassword ? 'text' : 'password');
                    eyeOpen.style.display = isPassword ? 'none' : 'block';
                    eyeClosed.style.display = isPassword ? 'block' : 'none';
                });
            });

            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('inp-email').value.trim();
                const username = document.getElementById('inp-username').value.trim();
                const password = document.getElementById('inp-password').value;
                const passwordConfirm = document.getElementById('inp-password-confirm').value;

                const errBox = document.getElementById('msg-error');
                const successBox = document.getElementById('msg-success');
                errBox.style.display = 'none';
                successBox.style.display = 'none';

                if (password !== passwordConfirm) {
                    errBox.textContent = "Passwords do not match.";
                    errBox.style.display = 'block';
                    return;
                }

                const btn = document.getElementById('btn-submit');
                btn.disabled = true;
                btn.textContent = 'SAVING...';

                try {
                    const currentSession = await getSession();
                    
                    if (currentSession) {
                        // User is logged in (clicked invite link)
                        // Update password and metadata (username)
                        const { error } = await supabase.auth.updateUser({
                            password: password,
                            data: { username: username }
                        });
                        if (error) throw error;
                        
                        successBox.textContent = "Profile updated successfully! Redirecting to dashboard...";
                        successBox.style.display = 'block';
                        
                        setTimeout(() => window.location.href = '/dashboard.html', 2000);
                    } else {
                        // Fresh sign up?
                        const { data, error } = await supabase.auth.signUp({
                            email: email,
                            password: password,
                            options: {
                                data: { username: username }
                            }
                        });
                        if (error) throw error;
                        
                        successBox.textContent = "Sign up successful! Please check your email to confirm your account.";
                        successBox.style.display = 'block';
                    }
                } catch (err) {
                    errBox.textContent = err.message;
                    errBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'SAVE PROFILE';
                }
            });
        })();
    </script>
</body>
</html>
