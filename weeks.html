<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Weeks — Nova Stat Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="brand-text">NOVA GAMING</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">MAIN</div>
                <a href="/" class="nav-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard" class="nav-icon"></iconify-icon><span>Dashboard</span></a>
                <a href="/weeks.html" class="nav-item active" data-page="weeks"><iconify-icon icon="lucide:calendar-days" class="nav-icon"></iconify-icon><span>Weeks</span></a>
                <div class="nav-section">ANALYSIS</div>
                <a href="/ocr-review.html" class="nav-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye" class="nav-icon"></iconify-icon><span>OCR Review</span></a>
                <a href="/leaderboards.html" class="nav-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy" class="nav-icon"></iconify-icon><span>Leaderboards</span></a>
                <a href="/exports.html" class="nav-item" data-page="exports"><iconify-icon icon="lucide:download-cloud" class="nav-icon"></iconify-icon><span>Exports</span></a>
                <div class="nav-section">SYSTEM</div>
                <a href="/settings.html" class="nav-item" data-page="settings"><iconify-icon icon="lucide:settings" class="nav-icon"></iconify-icon><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><button data-action="signout" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;gap:6px;"><iconify-icon icon="lucide:log-out"></iconify-icon> Sign Out</button></div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu-btn" id="mobile-menu-toggle"><iconify-icon icon="lucide:menu"></iconify-icon></button>
                    <h1 class="page-title">Weeks</h1>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm" id="btn-new-week"><iconify-icon icon="lucide:plus"></iconify-icon> New Week</button>
                    <div class="user-profile"><div class="avatar">U</div><div class="user-info"><span class="user-name">User</span><span class="user-role">Member</span></div></div>
                </div>
            </header>

            <main class="page-content">
                <div class="empty-state" id="empty-weeks" style="display:none;">
                    <iconify-icon icon="lucide:calendar-search"></iconify-icon>
                    <h2>No Weeks Created</h2>
                    <p>Create a weekly session to start tracking scrims.</p>
                    <button class="btn btn-primary" onclick="document.getElementById('btn-new-week').click()">Create First Week</button>
                </div>

                <!-- Mobile: Create Week button (floating) -->
                <button class="btn btn-primary btn-block mb-md" id="mobile-new-week" onclick="openModal()" style="display:none;">
                    <iconify-icon icon="lucide:plus"></iconify-icon> Create New Week
                </button>

                <div id="weeks-container"></div>
            </main>
        </div>
    </div>

    <!-- Create Week Modal -->
    <div class="modal-overlay" id="modal-create">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 class="modal-title">Create New Week</h2>
            <div class="form-group">
                <label class="form-label">Week Name</label>
                <input type="text" class="form-input" id="inp-week-name" placeholder="e.g. March Week 2">
            </div>
            <div class="form-group">
                <label class="form-label">Number of Days</label>
                <select class="form-select" id="inp-week-days">
                    <option value="5">5 Days</option>
                    <option value="7" selected>7 Days</option>
                </select>
            </div>
            <div class="flex gap-sm mt-md">
                <button class="btn btn-secondary flex-1" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary flex-1" id="btn-save-week">Create Week</button>
            </div>
        </div>
    </div>

    <!-- Bottom Tabs -->
    <nav class="bottom-tabs">
        <a href="/" class="tab-item" data-page="dashboard"><iconify-icon icon="lucide:layout-dashboard"></iconify-icon><span>Home</span></a>
        <a href="/weeks.html" class="tab-item active" data-page="weeks"><iconify-icon icon="lucide:calendar-days"></iconify-icon><span>Weeks</span></a>
        <a href="/ocr-review.html" class="tab-item" data-page="ocr-review"><iconify-icon icon="lucide:scan-eye"></iconify-icon><span>OCR</span></a>
        <a href="/leaderboards.html" class="tab-item" data-page="leaderboards"><iconify-icon icon="lucide:trophy"></iconify-icon><span>Ranks</span></a>
        <a href="/settings.html" class="tab-item" data-page="settings"><iconify-icon icon="lucide:settings"></iconify-icon><span>More</span></a>
    </nav>

    <script type="module">
        import { initApp, showToast } from '/src/router.js';
        import { createWeek, getAllWeeksWithDays, deleteWeek } from '/src/db.js';

        await initApp('weeks');

        const container = document.getElementById('weeks-container');
        const emptyState = document.getElementById('empty-weeks');
        const mobileBtn = document.getElementById('mobile-new-week');

        // Show mobile create button on small screens
        if (window.innerWidth <= 768) mobileBtn.style.display = 'flex';

        window.openModal = () => document.getElementById('modal-create').classList.add('show');
        window.closeModal = () => document.getElementById('modal-create').classList.remove('show');

        document.getElementById('btn-new-week').addEventListener('click', () => openModal());

        async function loadWeeks() {
            try {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><iconify-icon icon="lucide:loader-2" class="spin" style="font-size:2rem;"></iconify-icon><p style="margin-top:12px;">Loading weeks...</p></div>';
                
                // Fetch weeks and their associated days in a SINGLE network query! Extremely fast.
                const weeks = await getAllWeeksWithDays();
                if (weeks.length === 0) {
                    container.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';

                container.innerHTML = '';
                container.className = 'weeks-grid';

                weeks.forEach((wk) => {
                    const days = wk.days || [];
                    const completed = days.filter(d => d.status === 'completed').length;
                    const total = wk.total_days || days.length;
                    const pct = Math.round((completed / total) * 100);

                    const card = document.createElement('div');
                    card.className = 'week-card';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-sm">
                            <div class="week-title">${wk.name}</div>
                            <span class="badge badge-${wk.status}">${wk.status}</span>
                        </div>
                        <div class="week-meta"><iconify-icon icon="lucide:calendar"></iconify-icon> ${total} Day Sprint</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                        <div style="font-size:0.78rem;color:var(--text-muted);text-align:right;margin:6px 0 12px;">${completed}/${total} Days</div>
                        <div class="flex gap-sm">
                            <a href="/week-view.html?id=${wk.id}" class="btn btn-primary btn-sm flex-1">Open</a>
                            <button class="btn btn-danger btn-sm" onclick="handleDelete('${wk.id}')">
                                <iconify-icon icon="lucide:trash-2"></iconify-icon>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '';
                showToast('Failed to load weeks: ' + e.message, 'error');
            }
        }

        document.getElementById('btn-save-week').addEventListener('click', async () => {
            const name = document.getElementById('inp-week-name').value.trim();
            const days = parseInt(document.getElementById('inp-week-days').value);
            if (!name) return showToast('Week name required', 'error');

            const btn = document.getElementById('btn-save-week');
            btn.disabled = true; btn.textContent = 'Creating...';
            try {
                await createWeek(name, days);
                closeModal();
                document.getElementById('inp-week-name').value = '';
                showToast(`${name} created with ${days} days!`, 'success');
                await loadWeeks();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Create Week';
            }
        });

        window.handleDelete = async (id) => {
            if (!confirm('Delete this week and all its data?')) return;
            try {
                await deleteWeek(id);
                showToast('Week deleted', 'success');
                await loadWeeks();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        };

        loadWeeks();
    </script>
</body>
</html>
