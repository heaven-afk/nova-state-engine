<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Barlow', sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 15vw, 8rem);
            color: #6CB604;
            line-height: 1;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(108,182,4,0.25);
        }
        .error-msg {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: transparent;
            color: #6CB604;
            border: 1px solid rgba(108,182,4,0.3);
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(108,182,4,0.1);
            border-color: #6CB604;
            box-shadow: 0 0 20px rgba(108,182,4,0.15);
        }
        .back-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <img src="/assets/brand/nova_logo_nmark.png" alt="" width="64" height="64" style="opacity:0.4;margin-bottom:20px;">
        <div class="error-code">404</div>
        <div class="error-msg">This page doesn't exist.</div>
        <a href="/stats.html" class="back-btn">← BACK TO STATS</a>
