<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>GFX Generator — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Oswald:wght@400;700&family=Rajdhani:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .studio-layout { display: flex; gap: 24px; align-items: flex-start; flex-direction: column; }
        @media (min-width: 1024px) { .studio-layout { flex-direction: row; } }
        
        .panel-controls { flex: 0 0 340px; width: 100%; }
        .panel-preview { flex: 1; width: 100%; min-width: 0; }
        
        .preview-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            min-height: 500px;
            position: relative;
        }

        /* ── GFX Render Container (Fixed Width, Auto Height) ── */
        .gfx-canvas {
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transform-origin: top left;
            transition: transform 0.2s;
        }

        /* Template cards selector UI */
        .template-card {
            border: 1px solid var(--border-default);
            border-radius: 6px;
            padding: 12px;
            background: var(--elev-1);
            text-align: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .template-card:hover {
            border-color: var(--n-400);
            transform: translateY(-2px);
            background: var(--elev-2);
        }
        .template-card.active {
            border-color: var(--nova-green) !important;
            box-shadow: 0 0 12px var(--nova-glow);
            background: var(--elev-3);
        }
        .btn-tab {
            transition: all 0.2s;
        }
        .btn-tab:hover {
            color: var(--n-100) !important;
        }

        @media (max-width: 768px) {
            .studio-layout { gap: 16px; }
            .panel-controls { flex-basis: auto; }
            .preview-wrapper {
                min-height: 280px;
                padding: 14px;
                align-items: flex-start;
                justify-content: flex-start;
            }
            .panel-controls .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-body">
        <div class="studio-layout">
            <!-- Controls -->
            <div class="panel-controls card card-body">
                <!-- Toggle Graphic Type -->
                <div class="form-group">
                    <label class="form-label">Graphic Type</label>
                    <div class="tab-toggle-container" style="display:flex; background:var(--elev-0); border:1px solid var(--border-default); border-radius:6px; padding:2px; margin-bottom:4px;">
                        <button type="button" class="btn-tab active" id="tab-team" style="flex:1; background:var(--elev-2); border:none; border-radius:4px; padding:8px; color:var(--n-100); font-family:var(--font-data); font-weight:700; text-transform:uppercase; font-size:0.8rem; cursor:pointer;">Team Rankings</button>
                        <button type="button" class="btn-tab" id="tab-player" style="flex:1; background:transparent; border:none; border-radius:4px; padding:8px; color:var(--n-300); font-family:var(--font-data); font-weight:700; text-transform:uppercase; font-size:0.8rem; cursor:pointer;">Player Rankings</button>
                    </div>
                </div>

                <!-- Template Selector Cards -->
                <div class="form-group">
                    <label class="form-label">Select Theme</label>
                    <div id="template-cards-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom:4px;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Data Source (Session)</label>
                    <select class="form-select" id="inp-session">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Event Name</label>
                    <input type="text" class="form-input" id="inp-event-name" placeholder="e.g. Scrims Finals">
                </div>

                <div class="form-group">
                    <label class="form-label">Round / Week</label>
                    <input type="text" class="form-input" id="inp-round-label" placeholder="e.g. WEEK 1 - FINALS">
                </div>

                <div class="form-group">
                    <label class="form-label">Branding Handle</label>
                    <input type="text" class="form-input" id="inp-branding" placeholder="e.g. @novagaming" value="@novagaming">
                </div>

                <div style="margin-top: 24px; display:flex; flex-direction:column; gap:12px;">
                    <button class="btn btn-primary" id="btn-export">
                        <iconify-icon icon="lucide:image-down"></iconify-icon> EXPORT PNG
                    </button>
                </div>
            </div>

            <!-- Preview -->
            <div class="panel-preview">
                <div class="preview-wrapper" id="preview-wrapper">
                    <!-- Scaled visible preview -->
                    <div id="preview-scaler" style="transform-origin: top left; transform: scale(0.4);">
                        <div id="gfx-canvas" class="gfx-canvas">
                            <!-- Template-driven GFX rendered here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { getAllSessions, getMatchResults, getPlayerStats } from '/src/db.js';
        import { GFX_TEMPLATES, getTemplateById } from '/src/gfx-templates.js';
        import html2canvas from 'html2canvas';

        (async () => {
            const profile = await requireRole('admin');
            if (!profile) return;
            injectLayout('gfx', 'GFX STUDIO', profile);

            let sessions = [];
            let currentData = null;
            let graphicType = 'team'; // 'team' | 'player'
            let currentTemplateId = 'dark-ops';

            const selectSession = document.getElementById('inp-session');
            const inpEventName = document.getElementById('inp-event-name');
            const inpRoundLabel = document.getElementById('inp-round-label');
            const inpBranding = document.getElementById('inp-branding');
            
            const canvas = document.getElementById('gfx-canvas');
            const scaler = document.getElementById('preview-scaler');

            // FontFace preload (critical for html2canvas to render font styles correctly)
            async function preloadFonts() {
                await document.fonts.ready;
                console.log('Fonts preloaded.');
            }

            async function init() {
                await preloadFonts();
                renderTemplateSelector();

                sessions = await getAllSessions();
                if (sessions.length > 0) {
                    selectSession.innerHTML = sessions.map(s => `<option value="${s.id}">${s.session_name}</option>`).join('');
                    await loadData(sessions[0].id);
                }
                updateScale();
                window.addEventListener('resize', updateScale);
            }

            function updateScale() {
                const wrapper = document.getElementById('preview-wrapper');
                const template = getTemplateById(currentTemplateId);
                const w = template.canvas.width;
                // Wait for layout calculation to find the actual canvas client height
                const h = canvas.clientHeight || 550;
                
                const scale = Math.min((wrapper.clientWidth - 48) / w, (wrapper.clientHeight - 48) / h);
                scaler.style.transform = `scale(${scale})`;
                wrapper.style.minHeight = `${h * scale + 48}px`;
            }

            function renderTemplateSelector() {
                const container = document.getElementById('template-cards-container');
                container.innerHTML = GFX_TEMPLATES.map(t => {
                    const isActive = t.id === currentTemplateId ? 'active' : '';
                    return `
                        <div class="template-card ${isActive}" data-id="${t.id}" style="cursor:pointer;">
                            <div style="font-family:var(--font-display); font-size:0.68rem; font-weight:700; color:var(--n-100); text-transform:uppercase; margin-bottom:8px;">${t.label}</div>
                            <div style="display:flex; height:6px; border-radius:99px; overflow:hidden; gap:2px; background: rgba(255,255,255,0.05); padding:1px;">
                                <div style="flex:2; background:${t.canvas.background}; border-radius:3px 0 0 3px;"></div>
                                <div style="flex:1; background:${t.rankOverrides[1]?.borderLeft?.split(' ')[2] || '#fff'}; border-radius:0 3px 3px 0;"></div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.template-card').forEach(card => {
                    card.addEventListener('click', () => {
                        currentTemplateId = card.dataset.id;
                        renderTemplateSelector();
                        renderPreview();
                    });
                });
            }

            async function loadData(sessionId) {
                const session = sessions.find(s => s.id === sessionId);
                if (!session) return;
                
                const [results, players] = await Promise.all([
                    getMatchResults(sessionId), getPlayerStats(sessionId)
                ]);

                // Aggregate teams
                const teamMap = {};
                results.forEach(r => {
                    if (!teamMap[r.team_name]) {
                        teamMap[r.team_name] = { 
                            team_name: r.team_name, 
                            kills: 0, 
                            points: 0, 
                            lobbiesPlayed: 0, 
                            team_logo: r.teams?.team_logo || null 
                        };
                    }
                    teamMap[r.team_name].kills += r.kills;
                    teamMap[r.team_name].points += r.points;
                    teamMap[r.team_name].lobbiesPlayed += 1;
                });
                
                currentData = {
                    session,
                    teams: Object.values(teamMap).sort((a,b) => b.points - a.points),
                    players: players.slice(0, 10)
                };

                // Prefill defaults if blank
                inpEventName.value = session.session_name;
                inpRoundLabel.value = 'WEEK 1';
                
                renderPreview();
            }

            // HTML escape helper
            function escapeHTML(str) {
                if (!str) return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function renderPreview() {
                if (!currentData) return;

                const template = getTemplateById(currentTemplateId);
                const eventNameVal = inpEventName.value || currentData.session.session_name || 'NOVA GAMING';
                const roundLabelVal = inpRoundLabel.value || 'LEAGUE TABLE';
                const brandingVal = inpBranding.value || '@novagaming';

                // Apply canvas configuration
                canvas.style.width = `${template.canvas.width}px`;
                canvas.style.background = template.canvas.background;
                canvas.style.padding = template.canvas.padding;
                canvas.style.height = 'auto';

                // Header layout compilation
                let headerHTML = '';
                const titleFont = template.header.titleFont || 'Rajdhani, sans-serif';
                const titleSize = template.header.titleSize || '32px';
                const titleWeight = template.header.titleWeight || '700';
                const titleColor = template.header.titleColor || '#ffffff';
                const titleTransform = template.header.titleTransform || 'uppercase';
                const subtitleFont = template.header.subtitleFont || 'Inter, sans-serif';
                const subtitleSize = template.header.subtitleSize || '11px';
                const subtitleColor = template.header.subtitleColor || '#9b9bb4';
                const subtitleTransform = template.header.subtitleTransform || 'uppercase';
                const subtitleLetterSpacing = template.header.subtitleLetterSpacing || '0.2em';

                if (template.header.layout === 'sidebar-left') {
                    const sb = template.header.sidebar || {};
                    const sbText = sb.text || eventNameVal;
                    const sbColor = sb.color || '#c0392b';
                    const sbFont = sb.font || 'Rajdhani, sans-serif';
                    const sbSize = sb.fontSize || '13px';
                    const sbWeight = sb.fontWeight || '700';
                    const sbSpacing = sb.letterSpacing || '0.25em';

                    headerHTML = `
                        <div style="display: flex; gap: 24px; align-items: stretch; margin-bottom: 24px; text-align: left;">
                            <div style="writing-mode: vertical-lr; transform: rotate(180deg); display: flex; align-items: center; justify-content: center; color: ${sbColor}; font-family: ${sbFont}; font-size: ${sbSize}; font-weight: ${sbWeight}; letter-spacing: ${sbSpacing}; text-transform: uppercase; border-left: 2px solid ${sbColor}; padding-left: 8px; line-height: 1;">
                                ${escapeHTML(sbText)}
                            </div>
                            <div style="flex: 1;">
                                <h1 style="font-family: ${titleFont}; font-size: ${titleSize}; font-weight: ${titleWeight}; color: ${titleColor}; text-transform: ${titleTransform}; margin: 0; line-height: 1.1;">${escapeHTML(eventNameVal)}</h1>
                                <p style="font-family: ${subtitleFont}; font-size: ${subtitleSize}; color: ${subtitleColor}; text-transform: ${subtitleTransform}; letter-spacing: ${subtitleLetterSpacing}; margin: 6px 0 0 0; line-height: 1;">${escapeHTML(roundLabelVal)}</p>
                            </div>
                        </div>
                    `;
                } else if (template.header.layout === 'centered') {
                    headerHTML = `
                        <div style="text-align: center; width: 100%; margin-bottom: 24px;">
                            <h1 style="font-family: ${titleFont}; font-size: ${titleSize}; font-weight: ${titleWeight}; color: ${titleColor}; text-transform: ${titleTransform}; margin: 0 0 6px 0; line-height: 1.1;">${escapeHTML(eventNameVal)}</h1>
                            <p style="font-family: ${subtitleFont}; font-size: ${subtitleSize}; color: ${subtitleColor}; text-transform: ${subtitleTransform}; letter-spacing: ${subtitleLetterSpacing}; margin: 0; line-height: 1;">${escapeHTML(roundLabelVal)}</p>
                        </div>
                    `;
                } else {
                    // top-banner layout
                    headerHTML = `
                        <div style="background: ${template.header.background || 'rgba(255,255,255,0.03)'}; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 20px; width: 100%; margin-bottom: 24px; text-align: left;">
                            <h1 style="font-family: ${titleFont}; font-size: ${titleSize}; font-weight: ${titleWeight}; color: ${titleColor}; text-transform: ${titleTransform}; margin: 0; line-height: 1.1;">${escapeHTML(eventNameVal)}</h1>
                            <p style="font-family: ${subtitleFont}; font-size: ${subtitleSize}; color: ${subtitleColor}; text-transform: ${subtitleTransform}; letter-spacing: ${subtitleLetterSpacing}; margin: 6px 0 0 0; line-height: 1;">${escapeHTML(roundLabelVal)}</p>
                        </div>
                    `;
                }

                // Table Layout Compilation
                let bodyHTML = '';
                if (graphicType === 'team') {
                    // Column Header
                    const ch = template.columnHeader;
                    bodyHTML += `
                        <div style="display: flex; background: ${ch.background}; padding: ${ch.paddingY} 12px; font-family: ${ch.font}; font-size: ${ch.fontSize}; font-weight: ${ch.fontWeight}; color: ${ch.color}; text-transform: ${ch.textTransform}; letter-spacing: ${ch.letterSpacing}; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <div style="width: ${template.rank.width};">#</div>
                            <div style="flex: 1; text-align: left;">Team</div>
                            <div style="width: 80px; text-align: center;">Lobbies</div>
                            <div style="width: 80px; text-align: center;">Kills</div>
                            <div style="width: 100px; text-align: right;">Pts</div>
                        </div>
                    `;

                    // Rows
                    const limit = 10;
                    currentData.teams.slice(0, limit).forEach((t, i) => {
                        const rankNum = i + 1;
                        const rowConfig = template.row;
                        const rankOverride = template.rankOverrides[rankNum] || {};

                        const rowBg = rankOverride.background || (rankNum % 2 !== 0 ? rowConfig.oddBackground : rowConfig.evenBackground);
                        const rowBorderLeft = rankOverride.borderLeft || 'none';
                        const rowGlow = rankOverride.glowEffect ? `box-shadow: ${rankOverride.glowEffect};` : '';
                        const rankColor = rankOverride.rankColor || template.rank.color || rowConfig.color;
                        const rankWeight = rankOverride.rankFontWeight || template.rank.fontWeight || rowConfig.fontWeight;

                        const teamLogoHTML = t.team_logo 
                            ? `<img src="${t.team_logo}" style="width: 20px; height: 20px; border-radius: 4px; object-fit: cover; margin-right: 8px; vertical-align: middle;">`
                            : `<iconify-icon icon="lucide:shield" style="font-size: 1.1rem; color: rgba(255,255,255,0.4); margin-right: 8px; vertical-align: middle;"></iconify-icon>`;

                        bodyHTML += `
                            <div style="display: flex; align-items: center; background: ${rowBg}; border-bottom: ${rowConfig.borderBottom}; border-left: ${rowBorderLeft}; ${rowGlow} padding: ${rowConfig.paddingY} ${rowConfig.paddingX}; font-family: ${rowConfig.font}; font-size: ${rowConfig.fontSize}; font-weight: ${rowConfig.fontWeight}; color: ${rowConfig.color};">
                                <div style="width: ${template.rank.width}; font-family: ${template.rank.font}; font-size: ${template.rank.fontSize}; font-weight: ${rankWeight}; color: ${rankColor};">
                                    ${rankNum}
                                </div>
                                <div style="flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center;">
                                    ${teamLogoHTML}
                                    <span style="font-weight: 700;">${escapeHTML(t.team_name)}</span>
                                </div>
                                <div style="width: 80px; text-align: center; font-family: var(--font-data); font-size: 1rem; color: rgba(255,255,255,0.7);">${t.lobbiesPlayed}</div>
                                <div style="width: 80px; text-align: center; font-family: var(--font-data); font-size: 1rem; color: rgba(255,255,255,0.7);">${t.kills}</div>
                                <div style="width: 100px; text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--nova-green); font-size: 1.1rem;">${t.points}</div>
                            </div>
                        `;
                    });
                } else {
                    // Player Rankings
                    const ch = template.columnHeader;
                    bodyHTML += `
                        <div style="display: flex; background: ${ch.background}; padding: ${ch.paddingY} 12px; font-family: ${ch.font}; font-size: ${ch.fontSize}; font-weight: ${ch.fontWeight}; color: ${ch.color}; text-transform: ${ch.textTransform}; letter-spacing: ${ch.letterSpacing}; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <div style="width: ${template.rank.width};">#</div>
                            <div style="flex: 1.2; text-align: left;">Name</div>
                            <div style="flex: 1; text-align: left;">IGN</div>
                            <div style="flex: 1.2; text-align: left;">Team</div>
                            <div style="width: 80px; text-align: right;">Kills</div>
                        </div>
                    `;

                    // Rows
                    const limit = 10;
                    currentData.players.slice(0, limit).forEach((p, i) => {
                        const rankNum = i + 1;
                        const rowConfig = template.row;
                        const rankOverride = template.rankOverrides[rankNum] || {};

                        const rowBg = rankOverride.background || (rankNum % 2 !== 0 ? rowConfig.oddBackground : rowConfig.evenBackground);
                        const rowBorderLeft = rankOverride.borderLeft || 'none';
                        const rowGlow = rankOverride.glowEffect ? `box-shadow: ${rankOverride.glowEffect};` : '';
                        const rankColor = rankOverride.rankColor || template.rank.color || rowConfig.color;
                        const rankWeight = rankOverride.rankFontWeight || template.rank.fontWeight || rowConfig.fontWeight;

                        const teamLogoHTML = p.team_logo 
                            ? `<img src="${p.team_logo}" style="width: 18px; height: 18px; border-radius: 2px; object-fit: cover; margin-right: 6px; vertical-align: middle;">`
                            : `<iconify-icon icon="lucide:shield" style="font-size: 0.95rem; color: rgba(255,255,255,0.3); margin-right: 6px; vertical-align: middle;"></iconify-icon>`;

                        bodyHTML += `
                            <div style="display: flex; align-items: center; background: ${rowBg}; border-bottom: ${rowConfig.borderBottom}; border-left: ${rowBorderLeft}; ${rowGlow} padding: ${rowConfig.paddingY} ${rowConfig.paddingX}; font-family: ${rowConfig.font}; font-size: ${rowConfig.fontSize}; font-weight: ${rowConfig.fontWeight}; color: ${rowConfig.color};">
                                <div style="width: ${template.rank.width}; font-family: ${template.rank.font}; font-size: ${template.rank.fontSize}; font-weight: ${rankWeight}; color: ${rankColor};">
                                    ${rankNum}
                                </div>
                                <div style="flex: 1.2; text-align: left; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${escapeHTML(p.professional_name || p.player_name)}
                                </div>
                                <div style="flex: 1; text-align: left; font-family: var(--font-data); color: rgba(255,255,255,0.8);">
                                    ${escapeHTML(p.ign || p.player_name)}
                                </div>
                                <div style="flex: 1.2; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; color: rgba(255,255,255,0.7); font-size: 0.85rem;">
                                    ${teamLogoHTML}
                                    <span style="vertical-align: middle;">${escapeHTML(p.team_name)}</span>
                                </div>
                                <div style="width: 80px; text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--nova-green); font-size: 1.1rem;">
                                    ${p.kills}
                                </div>
                            </div>
                        `;
                    });
                }

                // Footer Compilation
                let footerHTML = '';
                if (template.footer.enabled) {
                    const ft = template.footer;
                    footerHTML = `
                        <div style="background: ${ft.background}; font-family: ${ft.font}; font-size: ${ft.fontSize}; color: ${ft.color}; padding-top: ${ft.paddingTop}; text-align: ${ft.layout}; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 16px;">
                            ${escapeHTML(brandingVal)} • Powered by Nova Gaming Network
                        </div>
                    `;
                }

                // Assemble everything inside the canvas container
                canvas.innerHTML = `
                    <div style="position: relative; z-index: 2;">
                        ${headerHTML}
                        ${bodyHTML}
                        ${footerHTML}
                    </div>
                `;

                updateScale();
            }

            // Controls listeners
            selectSession.addEventListener('change', e => loadData(e.target.value));
            inpEventName.addEventListener('input', renderPreview);
            inpRoundLabel.addEventListener('input', renderPreview);
            inpBranding.addEventListener('input', renderPreview);

            // Tab logic
            document.getElementById('tab-team').addEventListener('click', () => {
                graphicType = 'team';
                document.getElementById('tab-team').classList.add('active');
                document.getElementById('tab-team').style.background = 'var(--elev-2)';
                document.getElementById('tab-team').style.color = 'var(--n-100)';
                document.getElementById('tab-player').classList.remove('active');
                document.getElementById('tab-player').style.background = 'transparent';
                document.getElementById('tab-player').style.color = 'var(--n-300)';
                renderPreview();
            });

            document.getElementById('tab-player').addEventListener('click', () => {
                graphicType = 'player';
                document.getElementById('tab-player').classList.add('active');
                document.getElementById('tab-player').style.background = 'var(--elev-2)';
                document.getElementById('tab-player').style.color = 'var(--n-100)';
                document.getElementById('tab-team').classList.remove('active');
                document.getElementById('tab-team').style.background = 'transparent';
                document.getElementById('tab-team').style.color = 'var(--n-300)';
                renderPreview();
            });

            // Export logic
            document.getElementById('btn-export').addEventListener('click', async () => {
                if (!currentData) return;
                const btn = document.getElementById('btn-export');
                btn.disabled = true;
                btn.innerHTML = '<span class="btn-loader"></span> GENERATING...';
                
                try {
                    const template = getTemplateById(currentTemplateId);
                    
                    // html2canvas capture configuration
                    const canvasRender = await html2canvas(canvas, {
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: template.canvas.background,
                        logging: false
                    });
                    
                    const link = document.createElement('a');
                    const timestamp = new Date().toISOString().replace(/[-:.]/g, '').substring(0, 15);
                    link.download = `CODM_${graphicType}_${currentTemplateId}_${timestamp}.png`;
                    link.href = canvasRender.toDataURL('image/png');
                    link.click();
                    showToast('Downloaded!', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Failed to export image', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:image-down"></iconify-icon> EXPORT PNG';
                }
            });

            await init();
        })();
    </script>
</body>
</html>
