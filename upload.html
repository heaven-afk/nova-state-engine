<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Results — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .upload-wrapper { max-width: 800px; margin: 0 auto; }
        .ocr-grid { display: grid; gap: 16px; margin-top: 24px; }
        .ocr-card {
            background: var(--bg-card); border: 0.5px solid var(--border-default);
            border-radius: var(--radius); padding: 16px;
        }
        .ocr-card.low-conf { border-color: rgba(255, 165, 0, 0.4); background: rgba(255, 165, 0, 0.05); }
        .ocr-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: center; }
        @media (max-width: 600px) { .ocr-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-body">
        <div class="upload-wrapper">
            <!-- Setup Card -->
            <div class="card mb-md">
                <div class="card-header"><span class="card-title">NEW SESSION</span></div>
                <div class="card-body">
                    <form id="setup-form">
                        <div class="form-group">
                            <label class="form-label">Session Name</label>
                            <input type="text" class="form-input" id="inp-session" placeholder="e.g., Scrims Finals" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-input" id="inp-date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Total Lobbies</label>
                            <select class="form-select" id="inp-lobbies">
                                <option value="1">1 Lobby</option>
                                <option value="2">2 Lobbies</option>
                                <option value="3" selected>3 Lobbies</option>
                                <option value="4">4 Lobbies</option>
                                <option value="5">5 Lobbies</option>
                                <option value="6">6 Lobbies</option>
                                <option value="7">7 Lobbies</option>
                                <option value="8">8 Lobbies</option>
                                <option value="9">9 Lobbies</option>
                                <option value="10">10 Lobbies</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Paste Today's Team Slots (numbered list)</label>
                            <textarea class="form-input" id="inp-teams" rows="8" placeholder="1. 44 Regents&#10;2. Main Character OG&#10;3. Vox Mortis" required></textarea>
                            <small class="text-muted" style="margin-top: 4px; display: block;">Paste the list of teams for this session. It will be parsed automatically.</small>
                        </div>
                        <button class="btn btn-primary btn-block" type="submit" id="btn-create-session">
                            <iconify-icon icon="lucide:check-circle"></iconify-icon> CREATE & ACTIVATE SESSION
                        </button>
                    </form>
                </div>
            </div>

            <div id="active-session-banner" class="card mb-md hidden" style="border-top-color: var(--nova-green);">
                <div class="card-body" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size:0.8rem; color:var(--nova-green); font-weight:700;">ACTIVE SESSION</div>
                        <div id="active-session-name" style="font-size:1.2rem; font-weight:700;"></div>
                    </div>
                    <div style="text-align:right;">
                        <select class="form-select" id="inp-target-lobby" style="margin-bottom:0; width:150px;">
                            <!-- populated dynamically -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Upload Zone -->
            <div class="card mb-md hidden" id="upload-card">
                <div class="card-body">
                    <div class="upload-zone" id="drop-zone">
                        <iconify-icon icon="lucide:image-plus"></iconify-icon>
                        <div class="upload-zone-text">Drop result screenshots here or click to browse</div>
                        <div class="text-muted mt-sm" style="font-size:0.7rem;">Max 20 images. PNG, JPG, WEBP</div>
                        <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                    </div>
                    <div id="preview-grid" class="thumb-grid" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;"></div>
                    <button class="btn btn-primary btn-block mt-md hidden" id="btn-process">
                        <iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS WITH OCR
                    </button>
                </div>
            </div>

            <!-- OCR Results -->
            <div id="ocr-container" class="hidden">
                <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="section-title">OCR RESULTS</span>
                    <button class="btn btn-secondary btn-sm" id="btn-add-row"><iconify-icon icon="lucide:plus"></iconify-icon> Add Row</button>
                </div>
                <div class="progress-bar mb-md hidden" id="ocr-progress-container"><div class="progress-fill" id="ocr-progress" style="width:0%"></div></div>
                <div id="ocr-status" class="text-muted text-center mb-md" style="font-size:0.8rem;"></div>
                
                <div class="ocr-grid" id="ocr-results"></div>

                <div class="card mt-md card-body" style="background: rgba(108,182,4,0.05); border-color: var(--nova-green);">
                    <button class="btn btn-primary btn-block" id="btn-save">
                        <iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { createSession, insertMatchResults, insertPlayerStats, saveSessionTeams, getPointSystem } from '/src/db.js';
        import { supabase } from '/src/supabase.js';
        import { runOCRExtraction } from '/src/ocr-engine.js';

        (async () => {
            const profile = await requireRole('admin');
            if (!profile) return;
            injectLayout('upload', 'UPLOAD RESULTS', profile);

            document.getElementById('inp-date').valueAsDate = new Date();

            let activeDbSession = null;
            let activeTeams = [];
            let pointSystemConfig = null;

            let selectedFiles = [];
            let base64Images = [];
            let ocrData = [];

            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const previewGrid = document.getElementById('preview-grid');
            const btnProcess = document.getElementById('btn-process');
            
            // Session Setup Logic
            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const sessionName = document.getElementById('inp-session').value.trim();
                const date = document.getElementById('inp-date').value;
                const lobbyCount = parseInt(document.getElementById('inp-lobbies').value);
                const teamsText = document.getElementById('inp-teams').value;

                if (!sessionName || !teamsText) return showToast('Please fill all fields', 'error');

                const btn = document.getElementById('btn-create-session');
                btn.disabled = true;
                btn.innerHTML = 'CREATING...';

                try {
                    // Try to find exact match by name + date
                    const { data: existing } = await supabase.from('scrims_sessions')
                        .select('*').eq('session_name', sessionName).eq('date', date).maybeSingle();
                    
                    if (existing) {
                        activeDbSession = existing;
                        // Fetch existing teams
                        const { data: tData } = await supabase.from('session_teams').select('*').eq('session_id', activeDbSession.id).order('slot_number');
                        activeTeams = tData || [];
                    } else {
                        activeDbSession = await createSession(sessionName, date, lobbyCount, profile.id);
                        
                        // Parse teams
                        const lines = teamsText.split('\n').map(l => l.trim()).filter(l => l);
                        activeTeams = lines.map((l, i) => {
                            // Strip numbering like "1. ", "1)", "1- "
                            const name = l.replace(/^\d+[\.\)\-]\s*/, '').trim();
                            return { session_id: activeDbSession.id, slot_number: i+1, team_name: name };
                        });
                        await saveSessionTeams(activeTeams);
                    }

                    pointSystemConfig = await getPointSystem();

                    // Update UI
                    document.getElementById('setup-form').parentElement.parentElement.classList.add('hidden'); // Hide setup card
                    document.getElementById('active-session-banner').classList.remove('hidden');
                    document.getElementById('upload-card').classList.remove('hidden');
                    document.getElementById('active-session-name').textContent = activeDbSession.session_name;
                    
                    const lobbySelect = document.getElementById('inp-target-lobby');
                    lobbySelect.innerHTML = Array.from({length: activeDbSession.lobby_count}, (_, i) => `<option value="${i+1}">Lobby ${i+1}</option>`).join('');

                    showToast('Session Active! Ready for uploads.', 'success');
                } catch(err) {
                    showToast('Failed to create session: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:check-circle"></iconify-icon> CREATE & ACTIVATE SESSION';
                }
            });

            dropZone.addEventListener('click', () => fileInput.click());

            function handleFiles(files) {
                const valid = Array.from(files).filter(f => f.type.startsWith('image/')).slice(0, 20);
                selectedFiles = valid;
                base64Images = [];
                previewGrid.innerHTML = '';
                
                if (valid.length > 0) {
                    btnProcess.classList.remove('hidden');
                    document.getElementById('ocr-container').classList.add('hidden');
                } else {
                    btnProcess.classList.add('hidden');
                }

                valid.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        base64Images.push(e.target.result);
                        previewGrid.innerHTML += `<div class="thumb" style="width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid #333;"><img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;" alt="Preview"></div>`;
                    };
                    reader.readAsDataURL(file);
                });
            }

            btnProcess.addEventListener('click', async () => {
                if (base64Images.length === 0) return;
                
                const sessionName = document.getElementById('inp-session').value.trim();
                if (!sessionName) { showToast('Please enter a Session Name first', 'error'); return; }

                const btn = btnProcess;
                btn.disabled = true;
                btn.innerHTML = '<span class="spin">⟳</span> PROCESSING...';
                document.getElementById('ocr-container').classList.remove('hidden');
                document.getElementById('ocr-progress-container').classList.remove('hidden');
                document.getElementById('ocr-results').innerHTML = '';
                
                const statusText = document.getElementById('ocr-status');
                statusText.textContent = `Processing ${base64Images.length} images via AI Vision...`;
                document.getElementById('ocr-progress').style.width = '30%';

                try {
                    // Attach the JWT to auth the Vercel function
                    const { getSession } = await import('/src/auth.js');
                    const session = await getSession();
                    
                    // OCR pipeline handles deduplication natively now
                    const rawRecords = await runOCRExtraction(base64Images, session.access_token);
                    document.getElementById('ocr-progress').style.width = '100%';
                    statusText.textContent = `Found ${rawRecords.length} unique players across screenshots. Please review and verify.`;
                    
                    ocrData = rawRecords;
                    renderOCRResults();
                } catch (err) {
                    showToast(err.message, 'error', 6000);
                    statusText.textContent = `Error: ${err.message}`;
                    document.getElementById('ocr-progress').style.width = '0%';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS AGAIN';
                    setTimeout(() => document.getElementById('ocr-progress-container').classList.add('hidden'), 1000);
                }
            });

            function similarity(s1, s2) {
                let longer = s1, shorter = s2;
                if (s1.length < s2.length) { longer = s2; shorter = s1; }
                const longerLength = longer.length;
                if (longerLength === 0) return 1.0;
                const costs = [];
                for (let i = 0; i <= longerLength; i++) {
                    let lastValue = i;
                    for (let j = 0; j <= shorter.length; j++) {
                        if (i === 0) costs[j] = j;
                        else if (j > 0) {
                            let newValue = costs[j - 1];
                            if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            }
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                    if (i > 0) costs[shorter.length] = lastValue;
                }
                return (longerLength - costs[shorter.length]) / longerLength;
            }

            function fuzzyMatchTeam(ocrTeam) {
                if (!ocrTeam) return { match: null, conf: 0 };
                let bestMatch = null;
                let highestScore = 0;
                const lowerOcr = ocrTeam.toLowerCase().trim();
                
                activeTeams.forEach(t => {
                    const score = similarity(lowerOcr, t.team_name.toLowerCase());
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = t.team_name;
                    }
                });
                return { match: bestMatch, conf: highestScore };
            }

            function renderOCRResults() {
                const container = document.getElementById('ocr-results');
                if (ocrData.length === 0) {
                    container.innerHTML = '<div class="empty-state">No players found or all were duplicates.</div>';
                    return;
                }

                // Group by team for better review
                const teamMap = {};
                ocrData.forEach((r, idx) => {
                    const t = r.teamSlot || 'Unknown Team';
                    if (!teamMap[t]) teamMap[t] = [];
                    teamMap[t].push({ ...r, _idx: idx });
                });

                let html = '';
                const teamOptions = '<option value="">-- Select Team --</option>' + activeTeams.map(t => `<option value="${t.team_name}">${t.team_name}</option>`).join('');

                for (const [teamName, players] of Object.entries(teamMap)) {
                    html += `<div style="font-family:var(--font-data); font-size:1rem; font-weight:700; color:var(--nova-green); margin-top:16px; border-bottom:1px solid var(--border-default); padding-bottom:4px;">Grouped: ${teamName}</div>`;
                    
                    players.forEach(p => {
                        const { match, conf } = fuzzyMatchTeam(p.teamSlot);
                        let teamSelectVal = "";
                        let teamClass = "";
                        let warnIcon = "";
                        
                        if (conf >= 0.8) {
                            teamSelectVal = match;
                            teamClass = "ocr-card"; // Green implicit
                        } else if (conf > 0.4) {
                            teamSelectVal = match;
                            teamClass = "ocr-card low-conf"; // Amber/Warn
                            warnIcon = '<iconify-icon icon="lucide:alert-circle" class="text-orange" style="margin-left:8px;" title="Low confidence team match"></iconify-icon>';
                        } else {
                            teamClass = "ocr-card low-conf"; // Red/Warn
                            warnIcon = '<iconify-icon icon="lucide:alert-triangle" class="text-red" style="margin-left:8px;" title="No team match found"></iconify-icon>';
                        }

                        // Player name low conf
                        if (p.confidence < 0.8) {
                            teamClass = "ocr-card low-conf";
                            warnIcon += '<iconify-icon icon="lucide:help-circle" class="text-orange" style="margin-left:8px;" title="Low confidence player name"></iconify-icon>';
                        }

                        html += `
                        <div class="${teamClass}" data-idx="${p._idx}">
                            <div class="ocr-row">
                                <div class="form-group" style="margin:0;">
                                    <label class="form-label" style="display:flex;align-items:center;">Player IGN ${warnIcon}</label>
                                    <input type="text" class="form-input inp-ign" value="${p.normalizedName}">
                                </div>
                                <div style="display:flex;gap:12px;">
                                    <div class="form-group" style="margin:0;flex:1;">
                                        <label class="form-label">Kills</label>
                                        <input type="number" class="form-input inp-kills" value="${p.normalizedKills}" min="0">
                                    </div>
                                    <div class="form-group" style="margin:0;flex:2;">
                                        <label class="form-label">Mapped Team</label>
                                        <select class="form-select inp-team">
                                            ${teamOptions.replace(`value="${teamSelectVal}"`, `value="${teamSelectVal}" selected`)}
                                        </select>
                                    </div>
                                    <button class="btn-icon btn-del-row" style="margin-top:20px;color:var(--alert-red);"><iconify-icon icon="lucide:trash-2"></iconify-icon></button>
                                </div>
                            </div>
                        </div>`;
                    });
                }
                container.innerHTML = html;

                // Delete handlers
                document.querySelectorAll('.btn-del-row').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const card = e.target.closest('.ocr-card');
                        card.remove();
                    });
                });
            }

            document.getElementById('btn-add-row').addEventListener('click', () => {
                const container = document.getElementById('ocr-results');
                const newIdx = Date.now();
                const teamOptions = '<option value="">-- Select Team --</option>' + activeTeams.map(t => `<option value="${t.team_name}">${t.team_name}</option>`).join('');
                
                const html = `
                <div class="ocr-card" data-idx="${newIdx}">
                    <div class="ocr-row">
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">Player IGN</label>
                            <input type="text" class="form-input inp-ign" placeholder="Player Name">
                        </div>
                        <div style="display:flex;gap:12px;">
                            <div class="form-group" style="margin:0;flex:1;">
                                <label class="form-label">Kills</label>
                                <input type="number" class="form-input inp-kills" value="0" min="0">
                            </div>
                            <div class="form-group" style="margin:0;flex:2;">
                                <label class="form-label">Mapped Team</label>
                                <select class="form-select inp-team">${teamOptions}</select>
                            </div>
                            <button class="btn-icon btn-del-row" style="margin-top:20px;color:var(--alert-red);"><iconify-icon icon="lucide:trash-2"></iconify-icon></button>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('afterbegin', html);
                container.querySelector('.btn-del-row').addEventListener('click', (e) => e.target.closest('.ocr-card').remove());
            });

            function calculatePoints(placement, kills, pointSystem) {
                if (!pointSystem) return kills * 2;
                const { placement_points, kill_points } = pointSystem;
                
                let placementPts = 0;
                if (placement === 1) placementPts = placement_points["1"] || 0;
                else if (placement === 2) placementPts = placement_points["2"] || 0;
                else if (placement === 3) placementPts = placement_points["3"] || 0;
                else if (placement >= 4 && placement <= 9) placementPts = placement_points["4-9"] || 0;
                else if (placement >= 10) placementPts = placement_points["10-25"] || 0;
                
                const killPts = kills * (kill_points || 2);
                return placementPts + killPts;
            }

            document.getElementById('btn-save').addEventListener('click', async () => {
                if (!activeDbSession) { showToast('No active session!', 'error'); return; }
                const targetLobby = parseInt(document.getElementById('inp-target-lobby').value);

                const cards = document.querySelectorAll('.ocr-card');
                if (cards.length === 0) { showToast('No players to save', 'warning'); return; }

                const finalData = [];
                const teamMap = {}; // Aggregate team kills for match_results table

                let missingTeam = false;
                cards.forEach(card => {
                    const name = card.querySelector('.inp-ign').value.trim();
                    const kills = parseInt(card.querySelector('.inp-kills').value) || 0;
                    const team = card.querySelector('.inp-team').value;
                    
                    if (!name) return;
                    if (!team) { missingTeam = true; return; }

                    finalData.push({ player_name: name, kills, team_name: team, lobby_number: targetLobby });

                    if (!teamMap[team]) teamMap[team] = { team_name: team, kills: 0 };
                    teamMap[team].kills += kills;
                });

                if (missingTeam) { return showToast('Please assign a team to all players', 'error'); }
                if (finalData.length === 0) { showToast('All player rows are empty', 'error'); return; }

                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.innerHTML = '<span class="spin">⟳</span> SAVING...';

                try {
                    // 1. Clear old data for THIS lobby (allow re-uploads)
                    await supabase.from('player_stats')
                        .delete().eq('session_id', activeDbSession.id).eq('lobby_number', targetLobby);
                    await supabase.from('match_results')
                        .delete().eq('session_id', activeDbSession.id).eq('lobby_number', targetLobby);

                    // 2. Save Players
                    const playersToInsert = finalData.map(p => ({
                        session_id: activeDbSession.id,
                        lobby_number: targetLobby,
                        player_name: p.player_name,
                        team_name: p.team_name,
                        kills: p.kills
                    }));
                    await insertPlayerStats(playersToInsert);

                    // 3. Save Teams (Match Results)
                    // Sort teams by kills to determine placement
                    const sortedTeams = Object.values(teamMap).sort((a, b) => b.kills - a.kills);
                    const teamsToInsert = sortedTeams.map((t, i) => {
                        const placement = i + 1;
                        const points = calculatePoints(placement, t.kills, pointSystemConfig);
                        return {
                            session_id: activeDbSession.id,
                            lobby_number: targetLobby,
                            team_name: t.team_name,
                            kills: t.kills,
                            placement: placement,
                            points: points
                        };
                    });
                    await insertMatchResults(teamsToInsert);

                    showToast(`Lobby ${targetLobby} saved successfully!`, 'success');
                    setTimeout(() => window.location.href = '/matches.html', 1500);

                } catch (err) {
                    console.error('Save error:', err);
                    showToast('Failed to save to database', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY';
                }
            });
        })();
    </script>
</body>
</html>
