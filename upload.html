<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/brand/nova_favicon_64.png">
    <title>Upload Results — Nova Gaming Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .upload-wrapper { max-width: 800px; margin: 0 auto; }
        .ocr-grid { display: grid; gap: 16px; margin-top: 24px; }
        .ocr-card {
            background: var(--bg-card); border: 0.5px solid var(--border-default);
            border-radius: var(--radius); padding: 16px;
        }
        .ocr-card.auto-conf { border-color: rgba(108, 182, 4, 0.45); background: rgba(108, 182, 4, 0.04); }
        .ocr-card.low-conf { border-color: rgba(255, 165, 0, 0.4); background: rgba(255, 165, 0, 0.05); }
        .ocr-card.no-conf { border-color: rgba(255, 76, 0, 0.45); background: rgba(255, 76, 0, 0.06); }
        .ocr-row { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 16px; align-items: center; }
        .inp-kills {
            padding-right: 12px !important;
            padding-left: 12px !important;
            text-align: center;
        }
        .inp-kills::-webkit-outer-spin-button,
        .inp-kills::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .inp-kills {
            -moz-appearance: textfield;
        }
        .slot-preview { max-height: 260px; overflow: auto; margin: 12px 0 16px; border: 0.5px solid var(--border-default); border-radius: var(--radius); }
        .slot-preview-row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 8px 12px; border-bottom: 0.5px solid var(--border-subtle); font-family: var(--font-data); font-weight: 700; }
        .slot-preview-row:last-child { border-bottom: 0; }
        .match-indicator { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
        .confirm-match { margin-top: 10px; font-size: 0.82rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        @media (max-width: 600px) {
            .upload-wrapper { max-width: none; }
            .ocr-grid { gap: 12px; margin-top: 16px; }
            .ocr-card { padding: 14px; }
            .ocr-row { grid-template-columns: 1fr; gap: 12px; }
            .ocr-row > div:last-child { flex-wrap: wrap; gap: 10px !important; }
            .ocr-row > div:last-child .form-group { min-width: min(100%, 140px); }
            .ocr-row > div:last-child .form-group:last-of-type { flex-basis: 100%; }
            .btn-del-row { min-width: 44px; min-height: 44px; margin-top: 0 !important; margin-left: auto; }
            .match-indicator { width: 100%; margin-top: 4px; justify-content: flex-start; }
            .confirm-match { align-items: flex-start; line-height: 1.3; }
            .slot-preview { max-height: 220px; }
            #active-session-banner .card-body { flex-direction: column; align-items: stretch !important; gap: 12px; }
            #active-session-banner .card-body > div:last-child { text-align: left !important; }
            #inp-target-lobby { width: 100% !important; }
            #ocr-container .section-header { flex-wrap: wrap; gap: 10px; }
            #btn-add-row { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-body">
        <div class="upload-wrapper">
            <!-- Setup Card -->
            <div class="card mb-md">
                <div class="card-header"><span class="card-title">NEW SESSION</span></div>
                <div class="card-body">
                    <form id="setup-form">
                        <div class="form-group">
                            <label class="form-label">Session Name</label>
                            <input type="text" class="form-input" id="inp-session" placeholder="e.g., Scrims Finals" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-input" id="inp-date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Total Lobbies</label>
                            <input type="number" class="form-input" id="inp-lobbies" min="1" max="10" value="3" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Paste Today's Team Slots (numbered list)</label>
                            <textarea class="form-input" id="inp-teams" rows="8" placeholder="1. 44 Regents&#10;2. Main Character OG&#10;3. Vox Mortis" required></textarea>
                            <small class="text-muted" style="margin-top: 4px; display: block;">Paste the list of teams for this session. It will be parsed automatically.</small>
                        </div>
                        <div id="team-preview-panel" class="hidden">
                            <label class="form-label">Parsed Team Slot Preview</label>
                            <div class="slot-preview" id="team-preview-list"></div>
                        </div>
                        <button class="btn btn-primary btn-block" type="submit" id="btn-create-session">
                            <iconify-icon icon="lucide:list-checks"></iconify-icon> PREVIEW TEAM SLOTS
                        </button>
                    </form>
                </div>
            </div>

            <div id="active-session-banner" class="card mb-md hidden" style="border-top-color: var(--nova-green);">
                <div class="card-body" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size:0.8rem; color:var(--nova-green); font-weight:700;">ACTIVE SESSION</div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div id="active-session-name" style="font-size:1.2rem; font-weight:700;"></div>
                            <button class="btn btn-secondary btn-sm" id="btn-edit-session" style="padding: 4px 8px; min-height: 26px; font-size: 0.65rem; text-transform: uppercase; display: flex; align-items: center; gap: 4px;">
                                <iconify-icon icon="lucide:edit-3"></iconify-icon> Edit Setup
                            </button>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <select class="form-select" id="inp-target-lobby" style="margin-bottom:0; width:150px;">
                            <!-- populated dynamically -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Upload Zone -->
            <div class="card mb-md hidden" id="upload-card">
                <div class="card-body">
                    <div class="upload-zone" id="drop-zone">
                        <iconify-icon icon="lucide:image-plus"></iconify-icon>
                        <div class="upload-zone-text">Drop result screenshots here or click to browse</div>
                        <div class="text-muted mt-sm" style="font-size:0.7rem;">Max 20 images. PNG, JPG, WEBP</div>
                        <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                    </div>
                    <div id="preview-grid" class="thumb-grid" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;"></div>
                    <button class="btn btn-primary btn-block mt-md hidden" id="btn-process">
                        <iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS WITH OCR
                    </button>
                </div>
            </div>

            <!-- OCR Results -->
            <div id="ocr-container" class="hidden">
                <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="section-title">OCR RESULTS</span>
                    <button class="btn btn-secondary btn-sm" id="btn-add-row"><iconify-icon icon="lucide:plus"></iconify-icon> Add Row</button>
                </div>
                <div class="progress-bar mb-md hidden" id="ocr-progress-container"><div class="progress-fill" id="ocr-progress" style="width:0%"></div></div>
                <div id="ocr-status" class="text-muted text-center mb-md" style="font-size:0.8rem;"></div>
                
                <div class="ocr-grid" id="ocr-results"></div>

                <div class="card mt-md card-body" style="background: rgba(108,182,4,0.05); border-color: var(--nova-green);">
                    <button class="btn btn-primary btn-block" id="btn-save">
                        <iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireRole } from '/src/auth.js';
        import { injectLayout, showToast } from '/src/layout.js';
        import { createSession, insertMatchResults, insertPlayerStats, saveSessionTeams, getPointSystem, calculatePoints } from '/src/db.js';
        import { supabase } from '/src/supabase.js';
        import { runOCRExtraction } from '/src/ocr-engine.js';

        (async () => {
            const profile = await requireRole('admin');
            if (!profile) return;
            injectLayout('upload', 'UPLOAD RESULTS', profile);

            document.getElementById('inp-date').valueAsDate = new Date();

            let activeDbSession = null;
            let activeTeams = [];
            let pointSystemConfig = null;

            let selectedFiles = [];
            let base64Images = [];
            let ocrData = [];
            let pendingParsedTeams = [];
            let teamSlotsConfirmed = false;

            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const previewGrid = document.getElementById('preview-grid');
            const btnProcess = document.getElementById('btn-process');

            function escapeHTML(value) {
                return String(value ?? '').replace(/[&<>"']/g, char => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char]));
            }

            function parseTeamSlots(text) {
                return text.split('\n')
                    .map(line => line.trim())
                    .filter(Boolean)
                    .map((line, index) => ({
                        slot_number: index + 1,
                        team_name: line.replace(/^\d+[\s.)-]+/, '').trim()
                    }))
                    .filter(team => team.team_name.length > 0);
            }

            function renderTeamSlotPreview(teams) {
                document.getElementById('team-preview-panel').classList.remove('hidden');
                document.getElementById('team-preview-list').innerHTML = teams.map(team => `
                    <div class="slot-preview-row">
                        <span class="text-muted">#${team.slot_number}</span>
                        <span>${escapeHTML(team.team_name)}</span>
                    </div>
                `).join('');
            }
            
            // Session Setup Logic
            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const sessionName = document.getElementById('inp-session').value.trim();
                const date = document.getElementById('inp-date').value;
                const lobbyCount = parseInt(document.getElementById('inp-lobbies').value);
                const teamsText = document.getElementById('inp-teams').value;

                if (!sessionName || !teamsText) return showToast('Please fill all fields', 'error');

                const parsedTeams = parseTeamSlots(teamsText);
                if (parsedTeams.length === 0) return showToast('Could not parse any team slots', 'error');

                const slotSignature = JSON.stringify(parsedTeams);
                if (!teamSlotsConfirmed || JSON.stringify(pendingParsedTeams) !== slotSignature) {
                    pendingParsedTeams = parsedTeams;
                    teamSlotsConfirmed = true;
                    renderTeamSlotPreview(parsedTeams);
                    const btn = document.getElementById('btn-create-session');
                    btn.innerHTML = '<iconify-icon icon="lucide:check-circle"></iconify-icon> CONFIRM SLOTS & ACTIVATE SESSION';
                    showToast(`Preview ready: ${parsedTeams.length} team slots parsed`, 'success');
                    return;
                }

                const btn = document.getElementById('btn-create-session');
                btn.disabled = true;
                btn.innerHTML = 'CREATING...';

                try {
                    // Try to find exact match by name + date
                    const { data: existing } = await supabase.from('scrims_sessions')
                        .select('*').eq('session_name', sessionName).eq('date', date).maybeSingle();
                    
                    if (existing) {
                        activeDbSession = existing;
                        // Update total lobbies if they changed
                        if (existing.lobby_count !== lobbyCount) {
                            const { data: updated, error: updateErr } = await supabase.from('scrims_sessions')
                                .update({ lobby_count: lobbyCount })
                                .eq('id', existing.id)
                                .select()
                                .single();
                            if (updateErr) throw updateErr;
                            activeDbSession = updated;
                        }
                        // Update teams list: delete current ones and save the new list
                        await supabase.from('session_teams').delete().eq('session_id', activeDbSession.id);
                        activeTeams = pendingParsedTeams.map(team => ({
                            session_id: activeDbSession.id,
                            slot_number: team.slot_number,
                            team_name: team.team_name
                        }));
                        await saveSessionTeams(activeTeams);
                    } else {
                        activeDbSession = await createSession(sessionName, date, lobbyCount, profile.user.id);
                        
                        activeTeams = pendingParsedTeams.map(team => ({
                            session_id: activeDbSession.id,
                            slot_number: team.slot_number,
                            team_name: team.team_name
                        }));
                        await saveSessionTeams(activeTeams);
                    }

                    pointSystemConfig = await getPointSystem();

                    // Update UI
                    document.getElementById('setup-form').parentElement.parentElement.classList.add('hidden'); // Hide setup card
                    document.getElementById('active-session-banner').classList.remove('hidden');
                    document.getElementById('upload-card').classList.remove('hidden');
                    document.getElementById('active-session-name').textContent = activeDbSession.session_name;
                    
                    const lobbySelect = document.getElementById('inp-target-lobby');
                    const currentSelectedLobby = lobbySelect.value;
                    lobbySelect.innerHTML = Array.from({length: activeDbSession.lobby_count}, (_, i) => `<option value="${i+1}">Lobby ${i+1}</option>`).join('');
                    if (currentSelectedLobby && parseInt(currentSelectedLobby) <= activeDbSession.lobby_count) {
                        lobbySelect.value = currentSelectedLobby;
                    }

                    if (ocrData && ocrData.length > 0) {
                        renderOCRResults();
                    }

                    showToast('Session Active! Ready for uploads.', 'success');
                } catch(err) {
                    showToast('Failed to create session: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:list-checks"></iconify-icon> PREVIEW TEAM SLOTS';
                }
            });

            document.getElementById('inp-teams').addEventListener('input', () => {
                teamSlotsConfirmed = false;
                pendingParsedTeams = [];
                document.getElementById('team-preview-panel').classList.add('hidden');
                document.getElementById('btn-create-session').innerHTML = '<iconify-icon icon="lucide:list-checks"></iconify-icon> PREVIEW TEAM SLOTS';
            });

            document.getElementById('inp-target-lobby').addEventListener('change', () => {
                // Clear state for the newly selected lobby
                fileInput.value = '';
                selectedFiles = [];
                base64Images = [];
                previewGrid.innerHTML = '';
                btnProcess.classList.add('hidden');
                document.getElementById('ocr-container').classList.add('hidden');
                ocrData = [];
                document.getElementById('ocr-results').innerHTML = '';
                btnProcess.disabled = false;
                btnProcess.innerHTML = '<iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS WITH OCR';
                const btnSave = document.getElementById('btn-save');
                btnSave.disabled = false;
                btnSave.innerHTML = '<iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY';
            });

            document.getElementById('btn-edit-session').addEventListener('click', () => {
                document.getElementById('setup-form').parentElement.parentElement.classList.remove('hidden');
                document.getElementById('setup-form').scrollIntoView({ behavior: 'smooth' });
            });

            dropZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFiles(e.target.files);
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = 'var(--nova-green)';
                dropZone.style.background = 'rgba(108,182,4,0.08)';
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = '';
                dropZone.style.background = '';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = '';
                dropZone.style.background = '';
                if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
            });

            function handleFiles(files) {
                const valid = Array.from(files).filter(f => f.type.startsWith('image/')).slice(0, 20);
                selectedFiles = valid;
                base64Images = [];
                previewGrid.innerHTML = '';
                
                if (valid.length > 0) {
                    btnProcess.classList.remove('hidden');
                    document.getElementById('ocr-container').classList.add('hidden');
                } else {
                    btnProcess.classList.add('hidden');
                }

                valid.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        base64Images.push(e.target.result);
                        previewGrid.innerHTML += `<div class="thumb" style="width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid #333;"><img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;" alt="Preview"></div>`;
                    };
                    reader.readAsDataURL(file);
                });
            }

            btnProcess.addEventListener('click', async () => {
                if (base64Images.length === 0) return;
                
                const sessionName = document.getElementById('inp-session').value.trim();
                if (!sessionName) { showToast('Please enter a Session Name first', 'error'); return; }

                const btn = btnProcess;
                btn.disabled = true;
                btn.innerHTML = '<span class="spin">⟳</span> PROCESSING...';
                document.getElementById('ocr-container').classList.remove('hidden');
                document.getElementById('ocr-progress-container').classList.remove('hidden');
                document.getElementById('ocr-results').innerHTML = '';
                
                const statusText = document.getElementById('ocr-status');
                statusText.textContent = `Processing ${base64Images.length} images via AI Vision...`;
                document.getElementById('ocr-progress').style.width = '30%';

                try {
                    // Attach the JWT to auth the Vercel function
                    const { getSession } = await import('/src/auth.js');
                    const session = await getSession();
                    
                    // OCR pipeline handles deduplication natively now
                    const rawRecords = await runOCRExtraction(base64Images, session.access_token);
                    document.getElementById('ocr-progress').style.width = '100%';
                    statusText.textContent = `Found ${rawRecords.length} unique players across screenshots. Please review and verify.`;
                    
                    ocrData = rawRecords;
                    renderOCRResults();
                } catch (err) {
                    showToast(err.message, 'error', 6000);
                    statusText.textContent = `Error: ${err.message}`;
                    document.getElementById('ocr-progress').style.width = '0%';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS AGAIN';
                    setTimeout(() => document.getElementById('ocr-progress-container').classList.add('hidden'), 1000);
                }
            });

            function similarity(s1, s2) {
                let longer = s1, shorter = s2;
                if (s1.length < s2.length) { longer = s2; shorter = s1; }
                const longerLength = longer.length;
                if (longerLength === 0) return 1.0;
                const costs = [];
                for (let i = 0; i <= longerLength; i++) {
                    let lastValue = i;
                    for (let j = 0; j <= shorter.length; j++) {
                        if (i === 0) costs[j] = j;
                        else if (j > 0) {
                            let newValue = costs[j - 1];
                            if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            }
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                    if (i > 0) costs[shorter.length] = lastValue;
                }
                return (longerLength - costs[shorter.length]) / longerLength;
            }

            function fuzzyMatchTeam(ocrTeam) {
                if (!ocrTeam) return { match: null, conf: 0, status: 'red', label: 'No team read' };
                const slotMatch = String(ocrTeam).trim().match(/^(?:team|slot)?\s*#?\s*(\d+)$/i);
                if (slotMatch) {
                    const slotTeam = activeTeams.find(t => Number(t.slot_number) === Number(slotMatch[1]));
                    if (slotTeam) return { match: slotTeam.team_name, conf: 1, status: 'green', label: `Slot ${slotTeam.slot_number}` };
                }

                let bestMatch = null;
                let highestScore = 0;
                const lowerOcr = ocrTeam.toLowerCase().trim();
                
                activeTeams.forEach(t => {
                    const score = similarity(lowerOcr, t.team_name.toLowerCase());
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = t.team_name;
                    }
                });
                if (highestScore >= 0.8) return { match: bestMatch, conf: highestScore, status: 'green', label: `${Math.round(highestScore * 100)}% match` };
                if (bestMatch) return { match: bestMatch, conf: highestScore, status: 'amber', label: `${Math.round(highestScore * 100)}% suggestion` };
                return { match: null, conf: 0, status: 'red', label: 'No match' };
            }

            function renderOCRResults() {
                const container = document.getElementById('ocr-results');
                if (ocrData.length === 0) {
                    container.innerHTML = '<div class="empty-state">No players found or all were duplicates.</div>';
                    return;
                }

                // Group by team for better review
                const teamMap = {};
                ocrData.forEach((r, idx) => {
                    const t = r.teamSlot || 'Unknown Team';
                    if (!teamMap[t]) teamMap[t] = [];
                    teamMap[t].push({ ...r, _idx: idx });
                });

                let html = '';
                const makeTeamOptions = selected => '<option value="">-- Select Team --</option>' + activeTeams.map(t => {
                    const safeName = escapeHTML(t.team_name);
                    const isSelected = t.team_name === selected ? ' selected' : '';
                    return `<option value="${safeName}"${isSelected}>${safeName}</option>`;
                }).join('');

                for (const [teamName, players] of Object.entries(teamMap)) {
                    html += `<div style="font-family:var(--font-data); font-size:1rem; font-weight:700; color:var(--nova-green); margin-top:16px; border-bottom:1px solid var(--border-default); padding-bottom:4px;">Grouped: ${escapeHTML(teamName)}</div>`;
                    
                    players.forEach(p => {
                        const matchResult = fuzzyMatchTeam(p.teamSlot);
                        const teamSelectVal = matchResult.match || "";
                        let teamClass = "ocr-card auto-conf";
                        let indicatorClass = "text-green";
                        let indicatorIcon = "lucide:check-circle-2";
                        let confirmation = "";
                        
                        if (matchResult.status === 'amber') {
                            teamClass = "ocr-card low-conf";
                            indicatorClass = "text-gold";
                            indicatorIcon = "lucide:alert-circle";
                            confirmation = '<label class="confirm-match"><input type="checkbox" class="inp-confirm-match"> Confirm this suggested/corrected team mapping</label>';
                        } else if (matchResult.status === 'red') {
                            teamClass = "ocr-card no-conf";
                            indicatorClass = "text-red";
                            indicatorIcon = "lucide:alert-triangle";
                            confirmation = '<label class="confirm-match"><input type="checkbox" class="inp-confirm-match"> Confirm selected team mapping</label>';
                        }

                        // Player name low conf
                        if (p.confidence < 0.8) {
                            teamClass = "ocr-card low-conf";
                        }

                        html += `
                        <div class="${teamClass}" data-idx="${p._idx}" data-match-status="${matchResult.status}">
                            <div class="ocr-row">
                                <div class="form-group" style="margin:0;">
                                    <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
                                        <span>Player IGN</span>
                                        <span class="match-indicator ${indicatorClass}">
                                            <iconify-icon icon="${indicatorIcon}"></iconify-icon> ${escapeHTML(matchResult.label)}
                                        </span>
                                    </label>
                                    <input type="text" class="form-input inp-ign" value="${escapeHTML(p.normalizedName)}">
                                </div>
                                <div style="display:flex;gap:12px;">
                                    <div class="form-group" style="margin:0;flex:1;">
                                        <label class="form-label">Kills</label>
                                        <input type="number" class="form-input inp-kills" value="${p.normalizedKills}" min="0">
                                    </div>
                                    <div class="form-group" style="margin:0;flex:2;">
                                        <label class="form-label">Mapped Team</label>
                                        <select class="form-select inp-team">
                                            ${makeTeamOptions(teamSelectVal)}
                                        </select>
                                        ${confirmation}
                                    </div>
                                    <button class="btn-icon btn-del-row" style="margin-top:20px;color:var(--alert-red);"><iconify-icon icon="lucide:trash-2"></iconify-icon></button>
                                </div>
                            </div>
                        </div>`;
                    });
                }
                container.innerHTML = html;

                // Delete handlers
                document.querySelectorAll('.btn-del-row').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const card = e.target.closest('.ocr-card');
                        card.remove();
                    });
                });

                // Team dropdown change handlers to auto-confirm and styling updates
                document.querySelectorAll('.inp-team').forEach(select => {
                    select.addEventListener('change', (e) => {
                        const card = e.target.closest('.ocr-card');
                        const selectedVal = e.target.value;
                        const confirmCheckbox = card.querySelector('.inp-confirm-match');
                        const indicator = card.querySelector('.match-indicator');

                        if (selectedVal) {
                            if (confirmCheckbox) confirmCheckbox.checked = true;
                            card.className = "ocr-card auto-conf";
                            card.dataset.matchStatus = "green";
                            if (indicator) {
                                indicator.className = "match-indicator text-green";
                                indicator.innerHTML = '<iconify-icon icon="lucide:check-circle-2"></iconify-icon> Selected manually';
                            }
                        } else {
                            if (confirmCheckbox) confirmCheckbox.checked = false;
                            card.className = "ocr-card no-conf";
                            card.dataset.matchStatus = "red";
                            if (indicator) {
                                indicator.className = "match-indicator text-red";
                                indicator.innerHTML = '<iconify-icon icon="lucide:alert-triangle"></iconify-icon> No match';
                            }
                        }
                    });
                });
            }

            document.getElementById('btn-add-row').addEventListener('click', () => {
                const container = document.getElementById('ocr-results');
                const newIdx = Date.now();
                const teamOptions = '<option value="">-- Select Team --</option>' + activeTeams.map(t => `<option value="${escapeHTML(t.team_name)}">${escapeHTML(t.team_name)}</option>`).join('');
                
                const html = `
                <div class="ocr-card" data-idx="${newIdx}">
                    <div class="ocr-row">
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">Player IGN</label>
                            <input type="text" class="form-input inp-ign" placeholder="Player Name">
                        </div>
                        <div style="display:flex;gap:12px;">
                            <div class="form-group" style="margin:0;flex:1;">
                                <label class="form-label">Kills</label>
                                <input type="number" class="form-input inp-kills" value="0" min="0">
                            </div>
                            <div class="form-group" style="margin:0;flex:2;">
                                <label class="form-label">Mapped Team</label>
                                <select class="form-select inp-team">${teamOptions}</select>
                            </div>
                            <button class="btn-icon btn-del-row" style="margin-top:20px;color:var(--alert-red);"><iconify-icon icon="lucide:trash-2"></iconify-icon></button>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('afterbegin', html);
                container.querySelector('.btn-del-row').addEventListener('click', (e) => e.target.closest('.ocr-card').remove());
            });

            document.getElementById('btn-save').addEventListener('click', async () => {
                if (!activeDbSession) { showToast('No active session!', 'error'); return; }
                const targetLobby = parseInt(document.getElementById('inp-target-lobby').value);

                const cards = document.querySelectorAll('.ocr-card');
                if (cards.length === 0) { showToast('No players to save', 'warning'); return; }

                const finalData = [];
                const teamMap = {}; // Aggregate team kills for match_results table

                let missingTeam = false;
                let unconfirmedMatch = false;
                cards.forEach(card => {
                    const name = card.querySelector('.inp-ign').value.trim();
                    const kills = parseInt(card.querySelector('.inp-kills').value) || 0;
                    const team = card.querySelector('.inp-team').value;
                    const status = card.dataset.matchStatus;
                    const confirmInput = card.querySelector('.inp-confirm-match');
                    
                    if (!name) return;
                    if (!team) { missingTeam = true; return; }
                    if ((status === 'amber' || status === 'red') && !confirmInput?.checked) {
                        unconfirmedMatch = true;
                        return;
                    }

                    finalData.push({ player_name: name, kills, team_name: team, lobby_number: targetLobby });

                    if (!teamMap[team]) teamMap[team] = { team_name: team, kills: 0 };
                    teamMap[team].kills += kills;
                });

                if (missingTeam) { return showToast('Please assign a team to all players', 'error'); }
                if (unconfirmedMatch) { return showToast('Confirm every amber/red team mapping before saving', 'error'); }
                if (finalData.length === 0) { showToast('All player rows are empty', 'error'); return; }

                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.innerHTML = '<span class="spin">⟳</span> SAVING...';

                try {
                    // 1. Clear old data for THIS lobby (allow re-uploads)
                    await supabase.from('player_stats')
                        .delete().eq('session_id', activeDbSession.id).eq('lobby_number', targetLobby);
                    await supabase.from('match_results')
                        .delete().eq('session_id', activeDbSession.id).eq('lobby_number', targetLobby);

                    // 2. Save Players
                    const playersToInsert = finalData.map(p => ({
                        session_id: activeDbSession.id,
                        lobby_number: targetLobby,
                        player_name: p.player_name,
                        team_name: p.team_name,
                        kills: p.kills
                    }));
                    await insertPlayerStats(playersToInsert);

                    // 3. Save Teams (Match Results)
                    // Sort teams by kills to determine placement
                    const sortedTeams = Object.values(teamMap).sort((a, b) => b.kills - a.kills);
                    const teamsToInsert = sortedTeams.map((t, i) => {
                        const placement = i + 1;
                        const points = calculatePoints(placement, t.kills, pointSystemConfig);
                        return {
                            session_id: activeDbSession.id,
                            lobby_number: targetLobby,
                            team_name: t.team_name,
                            kills: t.kills,
                            placement: placement,
                            points: points
                        };
                    });
                    await insertMatchResults(teamsToInsert);

                    showToast(`Lobby ${targetLobby} saved successfully!`, 'success');
                    const nextLobby = targetLobby + 1;
                    if (nextLobby <= activeDbSession.lobby_count) {
                        setTimeout(() => {
                            // Select next lobby
                            const lobbySelect = document.getElementById('inp-target-lobby');
                            lobbySelect.value = nextLobby;
                            
                            // Reset state for next lobby upload
                            fileInput.value = '';
                            selectedFiles = [];
                            base64Images = [];
                            previewGrid.innerHTML = '';
                            btnProcess.classList.add('hidden');
                            document.getElementById('ocr-container').classList.add('hidden');
                            ocrData = [];
                            document.getElementById('ocr-results').innerHTML = '';
                            
                            btnProcess.disabled = false;
                            btnProcess.innerHTML = '<iconify-icon icon="lucide:scan-eye"></iconify-icon> PROCESS WITH OCR';
                            
                            btn.disabled = false;
                            btn.innerHTML = '<iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY';
                            
                            document.getElementById('active-session-banner').scrollIntoView({ behavior: 'smooth' });
                            showToast(`Ready to upload Lobby ${nextLobby}`, 'info');
                        }, 1500);
                    } else {
                        setTimeout(() => window.location.href = '/matches.html', 1500);
                    }

                } catch (err) {
                    console.error('Save error:', err);
                    showToast('Failed to save to database', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="lucide:save"></iconify-icon> CONFIRM & SAVE LOBBY';
                }
            });
        })();
    </script>
</body>
</html>
